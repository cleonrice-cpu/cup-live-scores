<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cup Live Scores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  color-scheme:light;
  --cream:#F6EBDC; --card:#FCF6EE; --tint:#EEDCC3;
  --ink:#141110; --char:#332E2A; --pink:#eb2f7b; --yellow:#efca2c; --mute:#7C6C61; --line:#DCC7AE;
  --dsp:"Anton","Arial Narrow","Haettenschweiler",sans-serif;
  --body:"Poppins",-apple-system,"Segoe UI",sans-serif;

  /* ── one fluid unit ──────────────────────────────────────────────────────
     9px at a 360px viewport, 17px at 2100px (the shell's max width), frozen
     above, and bounded by viewport height so a 720p TV shrinks the whole page
     to fit rather than scrolling. Every viewport-scaled size below is a
     multiple of it, so the proportion between any two elements is the same at
     every screen size and everything reaches its ceiling on the same pixel. */
  --k: clamp(9px, min(.46vw + 7.35px, 1.578vh - .86px), 17px);

  /* display steps — all on the --k curve */
  --d-mark : max(15px, calc(var(--k) * 1.42));   /* wordmark              */
  --d-badge: max(12px, calc(var(--k) * 1.00));   /* finals badge          */
  --d-team : calc(var(--k) * 1.50);              /* rail team name        */
  --d-h2   : calc(var(--k) * 1.55);              /* rail heading          */
  --d-rank : calc(var(--k) * 1.65);              /* rail position number  */
  --d-name : calc(var(--k) * 2.30);              /* tie header team name  */
  --d-lead : calc(var(--k) * 2.30);              /* band leader name      */
  --d-games: calc(var(--k) * 3.20);              /* rail games number     */
  --d-tie  : calc(var(--k) * 4.00);              /* tie aggregate score   */
  --d-big  : calc(var(--k) * 5.20);              /* band round number     */

  /* label steps — chrome, held above a legibility floor */
  --l-micro: clamp(9.5px, .18vw + 8.85px, 12px);
  --l-small: clamp(11px,  .20vw + 10.3px, 13.5px);
  --l-body : clamp(13px,  .20vw + 12.3px, 15.5px);

  /* space steps — same curve, so gaps track type */
  --sp-1: calc(var(--k) * .42);
  --sp-2: calc(var(--k) * .65);
  --sp-3: calc(var(--k) * .95);
  --sp-4: calc(var(--k) * 1.30);
  --sp-5: calc(var(--k) * 1.75);
  --sp-6: calc(var(--k) * 2.20);
  --sp-7: calc(var(--k) * 3.40);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);
     font-size:var(--l-body);line-height:1.4;-webkit-font-smoothing:antialiased;
     -webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit;border:none;background:none;
       touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input{font:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.n{font-variant-numeric:tabular-nums}
.shell{max-width:2100px;margin:0 auto;padding:0 var(--sp-5)}

/* ── top strip ── */
.top{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;
     padding-top:var(--sp-3);padding-bottom:var(--sp-3)}
.top img{width:calc(var(--k) * 4.9);height:auto;display:block}
.wordmark{font-family:var(--dsp);font-size:var(--d-mark);letter-spacing:.03em;text-transform:uppercase}
.top .sp{flex:1}
.tbtn{font-size:var(--l-micro);letter-spacing:.16em;text-transform:uppercase;font-weight:700;
      color:var(--mute);padding:.62em 1.1em;border:1.5px solid var(--line);border-radius:4px;white-space:nowrap}
.tbtn.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.live{display:flex;align-items:center;gap:.62em;font-size:var(--l-micro);letter-spacing:.16em;
      text-transform:uppercase;font-weight:700;color:var(--mute)}
.live i{width:.75em;height:.75em;border-radius:50%;background:var(--line);flex:none}
.live i.on{background:var(--pink)}
@media (prefers-reduced-motion:no-preference){ .live i.on{animation:bp 1.6s ease-in-out infinite} }
@keyframes bp{0%,100%{opacity:1}50%{opacity:.25}}
@media (max-width:520px){ .tbtn{letter-spacing:.1em} .live{letter-spacing:.1em} }

/* ── ink status band ── */
.band{background:var(--ink);color:var(--cream)}
.bin{max-width:2100px;margin:0 auto;padding:var(--sp-4) var(--sp-5);
     display:flex;align-items:center;gap:var(--sp-7);flex-wrap:wrap}
.bx .v{font-family:var(--dsp);font-size:var(--d-big);line-height:.85;color:var(--yellow)}
.bx .v.pk{color:var(--pink)}
.bx .k{font-size:var(--l-micro);letter-spacing:.2em;text-transform:uppercase;
       color:rgba(246,235,220,.6);font-weight:700;margin-top:var(--sp-2)}
.bx.lead{margin-left:auto;text-align:right;min-width:0}
.bx.lead .v{font-size:var(--d-lead);color:var(--cream);line-height:1}
@media (max-width:760px){ .bx.lead{margin-left:0;text-align:left} }

/* ── main grid ── */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,21vw,400px);
      gap:var(--sp-6);padding:var(--sp-5) 0 var(--sp-7);align-items:start}
@media (max-width:1279px){ .wrap{grid-template-columns:minmax(0,1fr)} }
/* the display is driven by a TV browser that often reports 960-1024 CSS px;
   the board must not stack there, because nobody can scroll it */
body.tv .wrap{grid-template-columns:minmax(0,1fr) clamp(220px,21vw,400px)}
body.tv .cts{grid-template-columns:repeat(3,minmax(0,1fr))}
body.kiosk #findBtn,body.kiosk .rh .seg{display:none}
@media (max-width:860px){
  body.tv .wrap{grid-template-columns:minmax(0,1fr)}
  body.tv .cts{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:900px){
  /* On a short screen the court is wide but low, so the width-derived sizes
     are additionally bounded by --k, which knows the viewport height. The
     ratios 5.00 (score:name) and 2.89 (score:edge) are identical either way. */
  body.kiosk .crt{--f-score:min(clamp(54px,26cqw,120px), calc(var(--k)*7.40));
               --f-edge :min(clamp(19px, 9cqw,41.5px), calc(var(--k)*2.56));
               --f-pn   :min(clamp(11px,5.2cqw, 24px), calc(var(--k)*1.48))}
  body.kiosk .wrap{padding-bottom:var(--sp-4)}
  body.kiosk{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  body.kiosk .shell{width:100%}          /* margin:0 auto would otherwise stop the stretch */
  body.kiosk .page{flex:1;display:flex;flex-direction:column}
    body.kiosk .wrap{flex:1;align-items:stretch}
  /* the standings filled two thirds of the column and left the rest blank;
     let the rows share the height instead of stacking at the top */
  body.kiosk .rail{display:flex;flex-direction:column}
  body.kiosk #rail{flex:1;display:flex;flex-direction:column}
  body.kiosk .sr{flex:1;padding:var(--sp-2) 0}
  body.kiosk .rnote{margin-top:var(--sp-4)}
  /* on a TV the secondary line has room to be legible from across the room */
  body.kiosk .sr .t2{font-size:calc(var(--k) * .95)}
  /* ten rows plus the two finals labels need a little less room than the
     four standings rows, or the board stops fitting the screen */
  body.kiosk .scr{flex:1;min-height:0;padding:var(--sp-1) 0}
  body.kiosk .lad{padding-bottom:var(--sp-2);margin-bottom:var(--sp-1)}
  body.kiosk .lnm{font-size:calc(var(--k) * .78)}
  body.kiosk .lp{font-size:calc(var(--k) * .70)}
  body.kiosk .flab{margin-top:0}
  body.kiosk .sm{font-size:calc(var(--k) * .82)}
  body.kiosk .rh .gcol,body.kiosk .rnote{font-size:calc(var(--k) * .78)}
  main{display:flex;flex-direction:column;gap:var(--sp-5)}
  .tie{flex:1;display:flex;flex-direction:column;margin-bottom:0}
  .cts{flex:1}
  .ct{display:flex;flex-direction:column}
  .crt{flex:1}
}

/* ── tie block ── */
main{container:tie / inline-size}
.tie{margin-bottom:var(--sp-5)}
.th{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;
    column-gap:var(--sp-6);margin-bottom:var(--sp-2);
    padding-bottom:var(--sp-2);border-bottom:2px solid var(--ink);
    --f-name:clamp(15px,5.20cqi,39px); --f-tie:clamp(26px,9.05cqi,68px)}
@supports not (container-type:inline-size){
  .th{--f-name:var(--d-name); --f-tie:var(--d-tie)}
}
.th .na{text-align:right;min-width:0}
.th .nb{text-align:left;min-width:0}
.th .scores{display:grid;grid-template-columns:2.3ch 1.1ch 2.3ch;align-items:baseline;
    column-gap:.18em;font-size:var(--f-tie);line-height:.82}
.sq{font-family:var(--dsp);font-size:var(--f-name);line-height:1;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sq .sm{display:none}
.sq.short .lg{display:none} .sq.short .sm{display:inline}
.tsc{font-family:var(--dsp);font-size:inherit;line-height:inherit;font-variant-numeric:tabular-nums}
.tsc.a{text-align:right} .tsc.b{text-align:left}
.tdash{font-family:var(--dsp);font-size:.42em;color:var(--mute);text-align:center;line-height:1}
.finb{font-family:var(--dsp);font-size:var(--d-badge);letter-spacing:.06em;text-transform:uppercase;
      color:var(--pink);margin-bottom:var(--sp-1)}

/* ── court ── */
.cts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3)}
@media (max-width:899px){ .cts{grid-template-columns:minmax(0,1fr)} }
.ct{background:var(--card);border:2px solid var(--ink);border-radius:5px;overflow:hidden;
    container-type:inline-size}
.ct.now{box-shadow:0 0 0 3px var(--pink)}
.cth{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-3);
     background:var(--ink);color:var(--cream)}
.cth b{font-family:var(--dsp);font-size:clamp(12px,3.6cqw,19px);letter-spacing:.05em;font-weight:400}
.cth .ln{font-size:var(--l-micro);letter-spacing:.16em;text-transform:uppercase;
         color:rgba(246,235,220,.6);font-weight:700}
.cth .st{margin-left:auto;font-size:var(--l-micro);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.cth .st.play{color:var(--pink)} .cth .st.done{color:var(--yellow)} .cth .st.wait{color:rgba(246,235,220,.45)}

/* The court sizes its own contents from its own width, so one of three on a
   TV and one full-width on a phone are the same picture at different scales.
   score : edge : name = 26 : 9 : 5.2, and all three cap at the same width. */
.crt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);--mix:55%;overflow:hidden;
     --f-score:clamp(54px,26cqw,120px);
     --f-edge :clamp(19px, 9cqw,41.5px);
     --f-pn   :clamp(11px,5.2cqw, 24px)}
@supports not (container-type:inline-size){
  .crt{--f-score:calc(var(--k)*6.9);--f-edge:calc(var(--k)*2.4);--f-pn:calc(var(--k)*1.35)}
}
.edge{position:absolute;top:0;bottom:0;z-index:0;pointer-events:none;
      writing-mode:vertical-rl;transform:rotate(180deg) scaleY(.88);
      display:flex;align-items:center;justify-content:center;
      font-family:var(--body);font-weight:700;font-size:var(--f-edge);
      letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb, var(--fg,#fff) 58%, transparent);white-space:nowrap}
.sd.l .edge{left:clamp(1px,.15vw,4px)} .sd.r .edge{right:clamp(1px,.15vw,4px)}
.sd{position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.30em;text-align:center;min-width:0;
    padding:var(--sp-3) var(--sp-2);
    background:color-mix(in srgb, var(--tc) var(--mix), var(--card))}
.sd .pn,.sd .g{position:relative;z-index:1}
.sd.r{border-left:2px dashed rgba(255,255,255,.55)}
.sd .g{font-family:var(--dsp);font-size:var(--f-score);line-height:.8;color:var(--ink)}
.sd.tbd .g{opacity:.18}
.sd.lost .g{opacity:.4}
.sd .pn{font-size:var(--f-pn);font-weight:700;line-height:1.2;letter-spacing:.07em;
        text-transform:uppercase;color:var(--char);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sd .pn.none{font-weight:600;opacity:.32;letter-spacing:.3em}

/* ── standings rail ── */
.rail{position:sticky;top:var(--sp-4)}
@media (max-width:1279px){ .rail{position:static} }
.rh{display:flex;align-items:baseline;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap}
.rh h2{margin:0;font-family:var(--dsp);font-size:var(--d-h2);text-transform:uppercase;font-weight:400}
.rh .seg{margin-left:auto;display:flex;gap:var(--sp-3)}
.rh .gcol{display:none;margin-left:auto;font-size:var(--l-micro);letter-spacing:.16em;
          text-transform:uppercase;font-weight:700;color:var(--mute)}
body.kiosk .rh .gcol{display:block}
.rh .seg button{font-size:var(--l-micro);letter-spacing:.14em;text-transform:uppercase;font-weight:700;
                color:var(--mute);padding-bottom:2px;border-bottom:2px solid transparent}
.rh .seg button.on{color:var(--ink);border-bottom-color:var(--pink)}
.sr{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;
    border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:none}
.sr.cut{border-bottom:3px solid var(--pink)}
.sr .pos{font-family:var(--dsp);font-size:var(--d-rank);width:1.1em;
         color:var(--line);flex:none;line-height:1}
.sr .mid{flex:1;min-width:0}
.sr .t1{font-family:var(--dsp);font-size:var(--d-team);text-transform:uppercase;line-height:1.05;
        overflow-wrap:anywhere}
.sr .t2{font-size:var(--l-micro);color:var(--mute);margin-top:.45em;font-weight:600}
.sr .t2 .tm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .g{font-family:var(--dsp);font-size:var(--d-games);line-height:1;font-weight:400;flex:none}
.rnote{font-size:var(--l-micro);color:var(--mute);margin-top:var(--sp-3);font-weight:600}

/* ── schedule page ── */
.scr{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0;
     border-bottom:1px solid var(--line)}
.scr:last-child{border-bottom:none}
.scr .rnum{font-family:var(--dsp);font-size:var(--d-rank);width:1.1em;color:var(--line);
           flex:none;line-height:1;text-align:center}
.scr.live .rnum{color:var(--pink)}
.scr .sms{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
/* the ladder, run across the head of the page instead of down it */
.lad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-2);
     padding-bottom:var(--sp-3);border-bottom:1px solid var(--line);flex:none}
.ldc{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;
     color:var(--tc);position:relative}
.ldc.cut::after{content:"";position:absolute;right:calc(var(--sp-2)/-2);top:6%;bottom:6%;
                width:2px;background:var(--pink)}
.lp{font-size:var(--l-micro);font-weight:700;opacity:.55;line-height:1}
.lnm{font-size:var(--l-micro);letter-spacing:.1em;text-transform:uppercase;font-weight:700;
     line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg{font-family:var(--dsp);font-size:var(--d-rank);line-height:1;font-variant-numeric:tabular-nums}
.sm{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);
    align-items:baseline;gap:.42em;font-size:var(--l-micro);font-weight:700;letter-spacing:.05em}
.sm .a{text-align:right}
.sm .b{text-align:left}
.sm .a,.sm .b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm .v{font-family:var(--dsp);font-weight:400;font-variant-numeric:tabular-nums;
       font-size:1.5em;line-height:1}
.sm .d{color:var(--mute);opacity:.45;font-size:.9em}
.sm .lo{opacity:.32}                     /* the squad that lost the tie */
.flab{font-size:.82em;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);
      font-weight:700;margin-top:2px;text-align:center}

/* ── scoring console ── */
.rounds{display:flex;gap:var(--sp-4);padding:var(--sp-3) 0 var(--sp-3);overflow-x:auto;scrollbar-width:none;
        border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:var(--sp-4)}
.rounds::-webkit-scrollbar{display:none}
.rd{flex:none;text-align:center;padding:0 3px 4px;border-bottom:3px solid transparent;min-width:34px}
.rd .a{font-family:var(--dsp);font-size:calc(var(--k)*1.2);line-height:1;color:var(--line)}
.rd .b{font-size:var(--l-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
       margin-top:3px;font-weight:700}
.rd.done .a{color:var(--mute)} .rd.isLive .a{color:var(--pink)}
.rd.sel{border-bottom-color:var(--ink)} .rd.sel .a{color:var(--ink)}
.ops{border-top:2px solid var(--ink);padding:var(--sp-3) var(--sp-3) var(--sp-4);background:var(--card)}
/* one full-width row of chips per side, each labelled, so the row never has to
   share a narrow column and the digits stay tappable at any court width */
.stp{display:flex;flex-direction:column;gap:var(--sp-3)}
.qslb{font-size:var(--l-micro);letter-spacing:.18em;text-transform:uppercase;
      font-weight:700;margin-bottom:5px}
/* tap-to-score: two taps settle a court, and nothing holds keyboard focus, so a
   publish-triggered reload can never land mid-entry and lose a digit */
.qs{display:flex;gap:4px}
.qs button{flex:1;min-width:0;background:var(--tint);border-radius:4px;padding:.5em 0;
  font-family:var(--dsp);font-size:clamp(17px,5.2cqw,30px);line-height:1;color:var(--mute)}
.qs button.on{background:var(--ink);color:var(--cream)}
.qs button.win{background:var(--pink);color:#fff}
@media (pointer:coarse){ .qs button{padding:.72em 0} }
.lu{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:var(--sp-3);align-items:start}
.lu>.cell{min-width:0}
.lu .s{display:flex;flex-wrap:wrap;gap:4px}
.lu .s.r{justify-content:flex-end}
.lu button{font-size:var(--l-small);font-weight:600;padding:5px 9px;border-radius:3px;background:var(--tint);
            color:var(--mute);display:inline-flex;align-items:baseline;gap:5px}
.lu button i{font-style:normal;font-size:.8em;font-weight:700;opacity:.6;font-variant-numeric:tabular-nums}
.lu button.on{background:var(--ink);color:var(--cream)}
.lu button.off{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.lnote{font-size:var(--l-micro);letter-spacing:.09em;text-transform:uppercase;font-weight:700;
       color:var(--mute);margin-top:var(--sp-1)}
.lnote .bad{color:var(--pink)}
.go{margin-top:var(--sp-3);width:100%;padding:11px;border-radius:4px;font-size:var(--l-small);
    font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.go.ready{background:var(--pink);color:#fff}
.go.done{background:var(--tint);color:var(--mute)}
.go.idle{color:var(--mute);cursor:default}
.bar2{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.bar2 .lb{font-size:var(--l-micro);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700}
.bar2 button{background:var(--tint);border-radius:4px;padding:8px 13px;font-size:var(--l-small);font-weight:600}
.bar2 button.pri{background:var(--pink);color:#fff}
.bar2 button.on{background:var(--ink);color:var(--cream)}

/* thumbs, not cursors: courtside the console is used one-handed on a phone */
@media (pointer:coarse){
  .lu button{padding:9px 12px}
  .go{padding:15px}
  .bar2 button,.tbtn{padding:11px 15px}
  .rd{min-width:44px;padding-bottom:8px}
  .rh .seg button{padding:6px 0 4px}
}

/* ── recovery banner ── */
.rec[hidden]{display:none}
.rec{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
     background:var(--pink);color:#fff;border-radius:5px;
     padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4);font-weight:600;font-size:var(--l-small)}
.rec b{font-weight:700}
.rec button{margin-left:auto;background:#fff;color:var(--pink);border-radius:4px;
            padding:8px 14px;font-weight:700;font-size:var(--l-micro);
            letter-spacing:.12em;text-transform:uppercase}
.rec button.ghost{margin-left:0;background:rgba(255,255,255,.2);color:#fff}

/* ── find overlay ── */
.ov[hidden]{display:none}
.ov{position:fixed;inset:0;background:rgba(20,17,16,.72);display:grid;place-items:start center;
    padding:9vh 16px;z-index:50}
.ovc{background:var(--cream);border:2px solid var(--ink);border-radius:6px;width:min(460px,100%);

.mvl{margin-bottom:var(--sp-3)} .mvl:last-child{margin-bottom:0}

.mvlh span{margin-left:auto;color:var(--dim);letter-spacing:.1em}
/* ── phone: the player first ── */
.mep{display:none}
body.phone .wrap{display:flex;flex-direction:column;align-items:stretch;gap:var(--sp-4)}
body.phone .mep{display:block;order:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:var(--sp-3) var(--sp-4)}
body.phone .rail{order:1} body.phone main{order:2}
body.phone #findBtn{display:none}
.mep input{width:100%;padding:12px 14px;border-radius:10px;background:var(--tint);border:1px solid var(--line);color:var(--ink);margin-top:var(--sp-1)}
.mep .tvh span{cursor:pointer}
.mep .meH{margin-top:var(--sp-3)}
</style>
<style id="cup-polish">
@media (max-width:899px){
  /* header: one tidy row */
  .shell.top{gap:var(--sp-2);padding-top:var(--sp-2);padding-bottom:var(--sp-2)}
  .top img{height:calc(var(--k)*3)}
  .wordmark{font-size:calc(var(--k)*1.25)}
  .tbtn{padding:.55em .8em;letter-spacing:.1em}
  /* status: one compact strip instead of three tiles */
  .bin{gap:var(--sp-2);padding-top:var(--sp-2);padding-bottom:var(--sp-2);align-items:stretch}
  .bx{padding:var(--sp-1) var(--sp-2);min-width:0;border-radius:10px;display:flex;align-items:baseline;gap:.4em}
  .bx .v{font-size:calc(var(--k)*1.5)} .bx .k{margin-top:0;letter-spacing:.14em}
  .bx.lead{margin-left:auto;text-align:right;flex-direction:column;align-items:flex-end;gap:0;padding-right:0}
  .bx.lead .v{font-size:calc(var(--k)*1.15);color:var(--ink)}
  /* You panel */
  body.phone .mep{padding:var(--sp-3)}
  body.phone .mep.set input,body.phone .mep.set #mhits{display:none}
  body.phone .mep .tvh{margin-bottom:0}
  body.phone .mep.set .tvh span{background:var(--tint);border-radius:6px;padding:.35em .7em}
  .mep .meH{margin-top:var(--sp-2)}
  .meNm{font-size:calc(var(--k)*2.1)}
  .meN{padding:14px 16px;border-radius:14px;margin-top:var(--sp-3)}
  .meNc{font-size:calc(var(--k)*3.2);letter-spacing:-.03em;line-height:1}
  .meNc small{font-family:var(--body);font-size:var(--l-micro);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-right:.5em;vertical-align:.9em}
  .meNp{font-size:var(--l-body);margin-top:6px}
  .meS{gap:6px} .meS div{padding:9px 4px;border-radius:9px} .meS b{font-size:calc(var(--k)*1.3)} .meS small{font-size:9px;letter-spacing:.1em}
  .meR{padding:8px 0;font-size:var(--l-small)}
  /* MVP list */
  .prize{background:color-mix(in srgb,var(--yellow) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--yellow) 45%,transparent);
         border-radius:10px;padding:8px 12px;font-size:var(--l-small);font-weight:600;margin-bottom:var(--sp-3);color:var(--ink)}
  html.light .prize{background:color-mix(in srgb,var(--yellow) 22%,var(--panel));border-color:#c9a800}
  body.phone .rail{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:var(--sp-3)}
  body.phone .rh{margin-bottom:var(--sp-2)}
  body.phone .rnote{display:none}
  body.phone .sr{padding:var(--sp-2) 0}
  /* courts: compact cards, no big map */
  body.phone main{gap:var(--sp-3)}
  body.phone main::before{content:"Live courts";display:block;font-size:var(--l-micro);letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:0 var(--sp-1)}
  body.phone .tie{padding:var(--sp-2) var(--sp-3) var(--sp-3);border-radius:14px}
  body.phone .th{margin-bottom:var(--sp-2);padding-bottom:var(--sp-2);--f-name:clamp(13px,4.2cqi,18px);--f-tie:clamp(20px,7cqi,30px)}
  body.phone .cts{gap:var(--sp-2)}
  body.phone .ct{border-radius:10px}
  body.phone .cth{padding:6px 10px} body.phone .cth b{font-size:15px}
  body.phone .crt{margin:6px;border-radius:8px;--f-score:30px;--f-edge:10px;--f-pn:14px}
  body.phone .sd{padding:8px 10px 6px;gap:1px;min-height:0}
  body.phone .sd .g{padding-top:0;line-height:.9}
  body.phone .sd::after{display:none}
  /* next up */
  body.phone .nx{border-radius:14px;padding:var(--sp-2) var(--sp-3)}
  body.phone .nx .nxh{font-size:calc(var(--k)*1.1)}
}
</style>
<style id="cup-times">
.meRn{display:flex;flex-direction:column;line-height:1}
.meTm{font-family:var(--body);font-weight:600;font-size:9px;letter-spacing:.02em;color:var(--dim);margin-top:2px;white-space:nowrap}
.meR{grid-template-columns:2.9em 1fr auto}
.meR.lunch{color:var(--ink);background:color-mix(in srgb,var(--yellow) 12%,transparent);border-radius:8px;padding:7px 8px;margin:4px 0}
.meR.lunch .meRn{font-size:1.1em;align-items:center}
html.light .meR.lunch{background:color-mix(in srgb,var(--yellow) 22%,transparent)}
.meNote{font-size:var(--l-micro);color:var(--dim);padding:6px 0 2px;letter-spacing:.02em}
</style>
<style id="cup-avatar">
.meH{display:flex;align-items:center;gap:12px}
.meAv{flex:none;width:calc(var(--k)*3.6);height:calc(var(--k)*3.6);border-radius:50%;object-fit:cover;background:var(--tint);border:2px solid var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.meAv.ini{display:flex;align-items:center;justify-content:center;font-family:var(--dsp);font-weight:700;font-size:calc(var(--k)*1.3);letter-spacing:.02em}
.meHt{min-width:0}
body.phone .meAv{width:56px;height:56px} body.phone .meAv.ini{font-size:20px}
</style>
</head>

<script>
/* ── Supabase (anon key; writes go through the PIN-checked RPCs) ── */
const SB_URL = (function(){

  if(typeof window.SB_URL_OVERRIDE==="string" && window.SB_URL_OVERRIDE) return window.SB_URL_OVERRIDE.replace(/\/+$/,"");
  return "https://vzgofxsgedmxvdagrono.supabase.co";

const SB_KEY = "sb_publishable_xUDMR5r_5RzNRhcjtObyrA_Ww4gphoU";
const SB_HDR = {"apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY};
const DECK_KEYS = ["fries", "punjabi", "samosas", "naans"];
let deckState = {}, decksLoaded = false, pin = null;
function sbAbort(ms){ const ac=new AbortController(); const t=setTimeout(function(){ try{ac.abort();}catch(e){} },ms);
  return {signal:ac.signal, done:function(){ clearTimeout(t); }}; }
/* GET cup_state rows; keys=null fetches every row. Returns {key: row}. */
async function sbGet(keys, ms){
  const a=sbAbort(ms||8000);
  try{
    const url=SB_URL+"/rest/v1/cup_state?select=key,doc,updated_at"+(keys?"&key=in.("+keys.join(",")+")":"");

}
async function sbRpc(fn, body, ms){
  const a=sbAbort(ms||15000);
  try{
    const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",cache:"no-store",
      headers:Object.assign({"Content-Type":"application/json"},SB_HDR),body:JSON.stringify(body),signal:a.signal});

    if(!r.ok){ let msg=""; try{ msg=JSON.parse(t).message||t; }catch(e){ msg=t; }
      throw {code:(/bad pin/i.test(msg)?"badpin":"http"), status:r.status, message:msg}; }

const D = {"teams": [{"name": "Sexy Fries", "cap": "Danny", "short": "FRIES", "c": "#efca2c", "tc": "#efca2c", "tcd": "#efca2c", "fg": "#0d0e12"}, {"name": "Punjabi 69ers", "cap": "Niladri", "short": "69ERS", "c": "#eb2f7b", "tc": "#eb2f7b", "tcd": "#eb2f7b", "fg": "#0d0e12"}, {"name": "Deconstructed Samosas", "cap": "Carolyn", "short": "SAMOSAS", "c": "#e86223", "tc": "#e86223", "tcd": "#e86223", "fg": "#0d0e12"}, {"name": "Naughty Naans", "cap": "Dennis", "short": "NAANS", "c": "#69bce7", "tc": "#69bce7", "tcd": "#69bce7", "fg": "#0d0e12"}], "lines": [[["Matteo Leonforte", "Adelio de Campos Junior", "Teel Gomez", "Akash Kapoor"], ["Cinji Lee", "Daniel Miranda", "Arjun Tyagi", "Lena Mendelson"], ["Nick Corposki", "Varun Saboo", "Jose Mayoral", "John George"]], [["Rohan Rajagopalan", "Abhi Ramachandiran", "Luke deWilde", "Sunny Haar"], ["Asang Mehta", "Ege Ozgirin", "Niladri Saha", "Gwen Lu"], ["Vihaan PH", "Shriram Bagavathyappan", "Bryan", "Maria Castillo"]], [["Jai Prasad", "William Fu", "Cleon Rice", "Michael Barskii"], ["Carolyn Yang", "Eli Sigal", "Anton Medvedev", "Marcus Arnold"], ["Vinayak Prabhakar", "Michael Sinitsky", "Brandon Reich", "Smarak Pattnaik"]], [["Daniel Davies", "Jason Hsu", "Kay Kay Shreyas", "Sergey Burykin"], ["Ben Clemes", "Christina Minju", "Alex Lipkin", "Simran Singh"], ["Tony Chenhansa", "Dennis Park", "Aranya Ram", "Akhil Kumar"]]], "rounds": [[[3, 0], [1, 2]], [[3, 1], [0, 2]], [[3, 2], [0, 1]], [[1, 2], [3, 0]], [[0, 2], [3, 1]], [[0, 1], [3, 2]], [[3, 0], [1, 2]], [[3, 1], [0, 2]], [[3, 2], [0, 1]]]};
const T = D.teams, LN = D.lines, RNDS = D.rounds;
/* Nine round-robin rounds (three complete cycles - every pair meets exactly
   three times), then the final as round 10. All four squads play round 10:
   the Cup final and the third-place tie run at once across the six courts,
   so a line fills 10 x 2 = 20 slots and each of its four players gets
   exactly five - the final included. */
const NR = 10, FINALS = 9, TARGET = 6;
const DISPLAY = {"Adelio de Campos Junior":"Coach Adelio"};
/* Slot 1..6 is the internal key (top block 1-2-3, bottom block 4-5-6).
   CNUM is what the club paints on the court itself: 6-4-2 across the top,
   5-3-1 across the bottom. Never use it as a key. */
const CNUM = {1:6, 2:4, 3:2, 4:5, 5:3, 6:1};
function cn(c){ return CNUM[c] || c; }

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function sn(n){ if(DISPLAY[n]) return DISPLAY[n];
  const p=n.trim().split(/\s+/); return p.length>1 ? p[0]+" "+p[p.length-1][0]+"." : p[0]; }

let state = readState();
let view=null, pinnedView=false, tab=(innerWidth<900?"mvp":"board"), me=null, scoring=false;
let pinLocal=false, pinRound=0;
let canWrite=false;
let dirty=false, inflight=false, timer=null, lastLive=null;

function readState(){
  try{ const st=JSON.parse($("cup-state").textContent);
    st.s=st.s||{}; st.f=st.f||{}; st.lu=st.lu||{};
    if(typeof st.live!=="number") st.live=0;
    if(typeof st.pin!=="boolean") st.pin=false;
    if(typeof st.pr!=="boolean") st.pr=false;
    st.show = st.show===true;   /* captains choose freely; only the five-round rule binds */
    if(st.st!==1 && st.st!==2) st.st=2;        // max consecutive ties a player may sit
    return st;
  }catch(e){ return {v:3,pin:false,pr:false,st:2,live:0,s:{},f:{},lu:{}}; }
}
function key(r,c){ return r+"|"+c; }
function sc(r,c){ const a=state.s[key(r,c)]; return a?[a[0]|0,a[1]|0]:[0,0]; }
function fin(r,c){ return !!state.f[key(r,c)]; }
function lu(r,c){ const a=state.lu[key(r,c)]; return a?[a[0]||[],a[1]||[]]:[[],[]]; }
function inCount(r){ let n=0; for(let c=1;c<=6;c++) if(fin(r,c)) n++; return n; }
function LIVE(){
  if(pinLocal) return pinRound;
  for(let r=0;r<NR;r++) if(inCount(r)<6) return r;
  return NR-1;
}
function seeds(){ return table().map(x=>x.i); }
function match(r,t){ if(r<FINALS) return RNDS[r][t]; const s=seeds(); return t===0?[s[0],s[1]]:[s[2],s[3]]; }

function table(){
  const rows=T.map((t,i)=>({i:i,gf:0,ga:0,tw:0,tl:0,td:0,done:0}));
  for(let r=0;r<FINALS;r++) for(let t=0;t<2;t++){
    const m=RNDS[r][t]; let A=0,B=0,all=true;
    for(let l=0;l<3;l++){ const c=t*3+l+1, s=sc(r,c); A+=s[0]; B+=s[1]; if(!fin(r,c)) all=false; }
    rows[m[0]].gf+=A; rows[m[0]].ga+=B; rows[m[1]].gf+=B; rows[m[1]].ga+=A;
    if(all){ rows[m[0]].done++; rows[m[1]].done++;
      if(A>B){rows[m[0]].tw++;rows[m[1]].tl++;} else if(B>A){rows[m[1]].tw++;rows[m[0]].tl++;}
      else {rows[m[0]].td++;rows[m[1]].td++;} }
  }
  rows.forEach(x=>x.d=x.gf-x.ga);
  rows.sort((a,b)=> b.gf-a.gf || b.d-a.d || b.tw-a.tw || a.i-b.i);
  return rows;
}
function mvp(){
  const m={}, add=(n,f,a,w,ti)=>{ if(!m[n]) m[n]={n:n,ti:ti,gf:0,cw:0,ct:0};
    m[n].gf+=f; m[n].ct++; if(w) m[n].cw++; m[n].ti=ti; };
  for(let r=0;r<NR;r++) for(let t=0;t<2;t++){
    let mt; try{ mt=match(r,t); }catch(e){ continue; }
    for(let l=0;l<3;l++){ const c=t*3+l+1; if(!fin(r,c)) continue;
      const s=sc(r,c), p=lu(r,c);
      p[0].forEach(n=>add(n,s[0],s[1],s[0]>s[1],mt[0]));
      p[1].forEach(n=>add(n,s[1],s[0],s[1]>s[0],mt[1])); }
  }
  const rows=Object.keys(m).map(k=>m[k]);
  rows.sort((a,b)=> b.gf-a.gf || b.cw-a.cw || a.n.localeCompare(b.n));
  return rows;
}
function mvpByLine(){ const all=mvp(), out=[[],[],[]];
  all.forEach(function(x){ const w=WHERE[x.n]; if(w) out[w.li].push(x); }); return out; }
function mvpRankInLine(n){ const w=WHERE[n]; if(!w) return -1; return mvpByLine()[w.li].findIndex(x=>x.n===n); }
/* cup-times: approximate round clock for the player page */
const RT=["10:10","10:45","11:20","11:55","12:30","13:05","13:40","14:15","14:50","15:30"];
const LUNCH_AFTER=4; /* lunch note sits after round 5 (index 4) */
const ALL=[], WHERE={};
LN.forEach((tm,ti)=>tm.forEach((ln,li)=>ln.forEach(n=>{ ALL.push(n); WHERE[n]={ti:ti,li:li}; })));
ALL.sort();

/* ── lineup legality ───────────────────────────────────────────────────────
   Rounds 1-10 only (the finals are "any two per line" and unconstrained).
   Hard rule from the flyer: everyone plays exactly five of the ten rounds.
   A line of four fills 10 rounds x 2 slots = 20 slots, so 5 each, exactly.
   Optional rule: all six partnerships in a line played at least once.
   Both are checked by completing the remaining rounds exactly, not guessed. */
const PAIRS=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
function pbit(a,b){ if(a>b){const t=a;a=b;b=t;}
  for(let k=0;k<6;k++) if(PAIRS[k][0]===a&&PAIRS[k][1]===b) return 1<<k; return 0; }

function lineSlots(ti,l){        // every round this line plays, the final included
  const out=[];
  for(let r=0;r<NR;r++){
    let c=-1,side=-1;
    for(let t=0;t<2;t++){
      let m; try{ m=match(r,t); }catch(e){ continue; }
      if(m[0]===ti){c=t*3+l+1;side=0;} else if(m[1]===ti){c=t*3+l+1;side=1;} }
    out.push(c<0?[]:lu(r,c)[side].slice());
  }
  return out;
}
function legal(slots, four, needPairs, maxSit){
  const idx={}; four.forEach((n,i)=>idx[n]=i);
  const fix=slots.map(p=>p.map(n=>idx[n]).filter(v=>v!==undefined));
  const cnt=[0,0,0,0];
  fix.forEach(ids=>ids.forEach(i=>cnt[i]++));
  const need=cnt.map(c=>5-c);
  if(need.some(v=>v<0)) return false;
  let free=0; fix.forEach(ids=>free+=(2-ids.length));
  if(need.reduce((a,b)=>a+b,0)!==free) return false;
  const memo=new Map(); let steps=0;
  function dfs(r,nd,msk,stk){
    if(++steps>120000) return true;                 // fail open: never lock the scorer out
    if(r===NR) return nd[0]===0&&nd[1]===0&&nd[2]===0&&nd[3]===0&&(!needPairs||msk===63);
    const key=r+'|'+nd.join(',')+'|'+msk+'|'+stk.join('');
    const hit=memo.get(key); if(hit!==undefined) return hit;
    if(needPairs){ let miss=0; for(let b=0;b<6;b++) if(!(msk&(1<<b))) miss++;
      if(miss>NR-r){ memo.set(key,false); return false; } }
    const ids=fix[r], cands=[];
    if(ids.length>=2) cands.push([ids[0],ids[1],[]]);
    else if(ids.length===1){ for(let j=0;j<4;j++) if(j!==ids[0]) cands.push([ids[0],j,[j]]); }
    else { for(let i=0;i<4;i++) for(let j=i+1;j<4;j++) cands.push([i,j,[i,j]]); }
    let res=false;
    for(const [a,b,spend] of cands){
      if(spend.some(p=>nd[p]<=0)) continue;
      const st2=stk.slice(); let bad=false;
      for(let p=0;p<4;p++){
        if(p===a||p===b) st2[p]=0;
        else { st2[p]=stk[p]+1; if(st2[p]>maxSit) bad=true; }
      }
      if(bad) continue;
      spend.forEach(p=>nd[p]--);
      if(dfs(r+1,nd,msk|pbit(a,b),st2)) res=true;
      spend.forEach(p=>nd[p]++);
      if(res) break;
    }
    memo.set(key,res); return res;
  }
  return dfs(0,need.slice(),0,[0,0,0,0]);
}
function lineInfo(ti,l){
  const four=LN[ti][l], slots=lineSlots(ti,l), idx={};
  four.forEach((n,i)=>idx[n]=i);
  const cnt={}; four.forEach(n=>cnt[n]=0);
  let mask=0, openR=0;
  slots.forEach(p=>{
    p.forEach(n=>{ if(n in cnt) cnt[n]++; });
    if(p.length>=2){ const a=idx[p[0]],b=idx[p[1]];
      if(a!==undefined&&b!==undefined) mask|=pbit(a,b); }
    else openR++;
  });
  let pairs=0; for(let b=0;b<6;b++) if(mask&(1<<b)) pairs++;
  const maxSit=state.st||1;
  const fiveOK=legal(slots,four,false,maxSit);
  const pairOK=fiveOK && legal(slots,four,true,maxSit);
  return {four, slots, cnt, pairs, openR, fiveOK, pairOK, maxSit};
}

/* ── light / dark ── */
const TEXT_LIGHT = {"#efca2c":"#8a6a00", "#e86223":"#b8440c", "#eb2f7b":"#c8145f", "#69bce7":"#1e6f9c"};
T.forEach(function(t){ t.tdark=t.tcd; t.tlight=TEXT_LIGHT[t.c.toLowerCase()]||t.tcd; });

function render(){

/* A TV browser cannot scroll, so whatever the CSS scale leaves over is taken
   out with a page zoom: measure at zoom 1, then shrink to fit the height. */
let fitT2=null;
function fitPage(){
  if(!document.body.classList.contains("kiosk") || document.body.classList.contains("showing")){ document.body.style.zoom=""; return; }
  document.body.style.zoom="";
  let z=1;
  for(let i=0;i<4;i++){            /* vw-based sizes grow back under zoom, so converge in a few passes */
    const need=document.documentElement.scrollHeight, have=innerHeight;
    if(need<=have) break;
    z=Math.max(.5, Math.floor(z*have/need*995)/1000); document.body.style.zoom=String(z);
  }
}
(function(){ const r0=render; render=function(){ r0.apply(this,arguments); clearTimeout(fitT2); fitT2=setTimeout(fitPage,50); }; })();
window.addEventListener("resize", function(){ clearTimeout(fitT2); fitT2=setTimeout(fitPage,150); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ setTimeout(fitPage,50); });

      (lead.gf?esc(T[lead.i].name):"—")+'</div><div class="k">'+

    (state.st===1 ? '<span class="lb" style="color:var(--pink)">locks alternating pairs &middot; captains stop choosing</span>'
                  : '<button class="'+(state.pr?"on":"")+'" id="prBtn">All six pairs: '+(state.pr?"required":"off")+'</button>');
}

/* The team name runs up the side of the court, so its size is bounded by the
   court's height while its font is set from the court's width. On a short
   screen (a 720p TV, three courts across) width overshoots height, so the
   fit is settled by measurement rather than by a guessed coefficient. */
function fitNames(){
  const all=[...document.querySelectorAll(".th .sq")];
  if(!all.length) return;
  all.forEach(e=>{ e.classList.remove("short"); e.style.removeProperty("font-size"); });
  const worst=()=>{ let f=1; all.forEach(e=>{ if(e.clientWidth>20 && e.scrollWidth>e.clientWidth)
      f=Math.min(f, e.clientWidth/e.scrollWidth); }); return f; };
  let f=worst();
  if(f<0.70){                       // shrunk that far, the short label reads better
    all.forEach(e=>e.classList.add("short"));
    f=worst();
  }
  if(f>=0.999) return;
  const base=parseFloat(getComputedStyle(all[0]).fontSize);
  const px=(base*f*0.98).toFixed(2)+"px";      // one size for every tie on screen
  all.forEach(e=>e.style.fontSize=px);
}
function fitEdges(){
  document.querySelectorAll(".edge").forEach(function(e){
    e.style.removeProperty("font-size");
    const box=e.clientHeight; if(box<8) return;
    const rng=document.createRange(); rng.selectNodeContents(e);
    const need=rng.getBoundingClientRect().height; if(need<=box) return;
    const cur=parseFloat(getComputedStyle(e).fontSize);
    e.style.fontSize=(cur*box/need*0.94).toFixed(2)+"px";
  });
}

function nextUp(){
  const L=LIVE(), n=L+1;
  if(view!==L || n>=NR) return "";
  let m0,m1; try{ m0=match(n,0); m1=match(n,1); }catch(e){ return ""; }   /* finals seeds not known yet */
  let cards="";
  [[0,m0],[1,m1]].forEach(function(x){ const t=x[0], m=x[1];
    for(let l=0;l<3;l++){ const c=t*3+l+1, p=lu(n,c);
      const side=function(i){ const ti=m[i], pr=p[i];
        return '<div><span class="nsq" style="color:'+T[ti].tcd+'">'+esc(T[ti].short)+'</span>'+
          (pr.length? pr.map(sn).map(esc).join(" &amp; ") : '<span class="tbd">line-up tbc</span>')+'</div>'; };
      cards+='<div class="nc"><b>Court '+cn(c)+'</b>'+side(0)+side(1)+'</div>';
    } });
  return '<section class="nx"><div class="nxh">Next up<small>'+(n===FINALS?"Finals":"Round "+(n+1))+'</small></div><div class="nxl">'+cards+'</div></section>';
}
function ties(){
  const r=view, L=LIVE(); let h="";
  for(let t=0;t<2;t++){
    const m=match(r,t); let A=0,B=0;
    for(let l=0;l<3;l++){ const s=sc(r,t*3+l+1); A+=s[0]; B+=s[1]; }
    h+='<section class="tie">';
    if(r===FINALS) h+='<div class="finb">'+(t===0?"Cup Final":"Third place")+'</div>';
    h+='<div class="th">'+
      '<span class="na sq" style="--sqc:'+T[m[0]].c+'">'+
        '<span class="lg">'+esc(T[m[0]].name)+'</span><span class="sm">'+esc(T[m[0]].short)+'</span></span>'+
      '<span class="scores">'+
        '<span class="tsc a" style="color:'+T[m[0]].tcd+'">'+A+'</span>'+
        '<span class="tdash">&ndash;</span>'+
        '<span class="tsc b" style="color:'+T[m[1]].tcd+'">'+B+'</span></span>'+
      '<span class="nb sq" style="--sqc:'+T[m[1]].c+'">'+

      '</div><div class="cts">';
    for(let l=0;l<3;l++) h+=court(r,t,l,m,L);

  const nx = (canWrite&&scoring) ? "" : nextUp(); h+=nx; document.body.classList.toggle("hasnx", !!nx);
  $("ties").innerHTML=h;
}

function court(r,t,l,m,L){
  const c=t*3+l+1, s=sc(r,c), F=fin(r,c), now=(r===L)&&!F, p=lu(r,c);
  const st = F ? '<span class="st done">Final</span>'
        : now ? '<span class="st play">On court</span>'
        : '<span class="st wait">'+(r<L?"Awaiting":"Next")+'</span>';
  const slot=(i,k)=>{ const n=p[i][k];
    return '<div class="pn'+(n?"":" none")+'">'+(n?esc(sn(n)):"&mdash;")+'</div>'; };
  function side(i,ti,g){
    const lost = F && g<sc(r,c)[1-i];
    return '<div class="sd '+(i?"r":"l")+(lost?" lost":"")+(F||s[0]||s[1]?"":" tbd")+
      '" style="--tc:'+T[ti].tc+';--fg:'+T[ti].fg+'">'+
      '<div class="edge">'+esc(T[ti].short)+'</div>'+
      slot(i,0)+slot(i,1)+'<div class="g n">'+g+'</div></div>';
  }
  let h='<div class="ct'+(now?" now":"")+'">'+
    '<div class="cth"><b><small>Court</small>'+cn(c)+'</b><span class="ln">Line '+(l+1)+'</span>'+st+'</div>'+
    '<div class="crt">'+side(0,m[0],s[0])+side(1,m[1],s[1])+'</div>';
  if(canWrite && scoring){
    const ready=(s[0]===TARGET)!==(s[1]===TARGET);
    const row=(i,ti)=>{ let o='<div><div class="qslb" style="color:'+T[ti].tcd+'">'+
        esc(T[ti].short)+'</div><div class="qs">';
      for(let v=0;v<=TARGET;v++) o+='<button data-set="'+r+'|'+c+'|'+i+'|'+v+'" class="'+
        (s[i]===v?(v===TARGET?"on win":"on"):"")+'" aria-label="'+esc(T[ti].short)+' '+v+
        ' games">'+v+'</button>';
      return o+'</div></div>'; };
    h+='<div class="ops"><div class="stp">'+row(0,m[0])+row(1,m[1])+'</div>'+
      '<div class="lu"><div class="cell">'+chips(r,c,0,m[0],l)+'</div>'+
        '<div class="cell">'+chips(r,c,1,m[1],l)+'</div></div>'+
      (F ? '<div class="go done">Counted '+s[0]+'&ndash;'+s[1]+'</div>'
         : '<div class="go idle">Tap the winner&rsquo;s 6</div>')+
      '</div>';
  }
  return h+'</div>';
}
function chips(r,c,side,ti,l){
  const p=lu(r,c)[side], four=LN[ti][l];
  let h='<div class="s'+(side?" r":"")+'">';
  const info=lineInfo(ti,l);
  const wantPairs = state.pr && info.pairOK;   // never enforce a rule the current state already breaks
  four.forEach(n=>{
    const on=p.indexOf(n)>=0;
    let dis=false, why="";
    if(!on && info.fiveOK){
      const next=p.slice(); next.push(n); if(next.length>2) next.shift();
      const trial=info.slots.map((x,i)=>i===r?next:x);
      if(!legal(trial,four,false,info.maxSit)){ dis=true;
        why = "would break the five-round rule or leave someone sitting "+
              (info.maxSit+1)+" ties in a row"; }
      else if(wantPairs && !legal(trial,four,true,info.maxSit)){ dis=true;
        why="would leave a partnership unplayable"; }
    }
    h+='<button data-lu="'+r+'|'+c+'|'+side+'" data-n="'+esc(n)+'" class="'+(on?"on":"")+
       (dis?" off":"")+'"'+(dis?' disabled title="'+esc(why)+'"':'')+'>'+esc(sn(n))+
       '<i>'+info.cnt[n]+'/5</i></button>';
  });
  h+='</div>';
  const warn = !info.fiveOK ? '<span class="bad">rules already broken on this line</span>'
             : (info.maxSit===1 ? 'alternating pairs &middot; '+info.pairs+'/2 set &middot; '+info.openR+' rounds open'
             : (state.pr && !info.pairOK ? '<span class="bad">six partnerships no longer all reachable</span>'
                                         : info.pairs+'/6 pairs &middot; '+info.openR+' rounds open'));
  return h+'<div class="lnote">'+warn+'</div>';
}

function rail(){
  if(document.body.classList.contains("kiosk")){ railTV(); return; }
  let h="";
  const btn={board:"tabT",mvp:"tabM"};
  for(const k in btn){ const b=$(btn[k]); if(b) b.classList.toggle("on", tab===k); }
  const gc=$("gcol"); if(gc) gc.style.display = tab==="mvp" ? "" : "none";
  if(tab==="board"){
    /* The ladder and the schedule are the same story at two resolutions, so
       they share a page: the four squads run across the top as a strip - which
       costs a quarter of the height four stacked rows did - and every round
       sits beneath it, with the squad that lost a tie greyed out. */
    const rows=table();
    h+='<div class="lad">';
    rows.forEach((x,i)=>{
      h+='<div class="ldc'+(i===1?" cut":"")+'" style="--tc:'+T[x.i].tcd+'">'+
        '<span class="lp n">'+(i+1)+'</span>'+
        '<span class="lnm">'+esc(T[x.i].short)+'</span>'+
        '<b class="lg n">'+x.gf+'</b></div>';
    });
    h+='</div>';
    for(let r=0;r<NR;r++){
      let lines="";
      for(let t=0;t<2;t++){
        let m; try{ m=match(r,t); }catch(e){ continue; }
        let A=0,B=0,done=true;
        for(let l=0;l<3;l++){ const c=t*3+l+1, sc2=sc(r,c); A+=sc2[0]; B+=sc2[1];
          if(!fin(r,c)) done=false; }
        const played=done||A||B, loA=done&&B>A, loB=done&&A>B;
        if(r===FINALS) lines+='<div class="flab">'+(t===0?"Cup final":"Third place")+'</div>';
        lines+='<div class="sm">'+
          '<span class="a'+(loA?" lo":"")+'" style="color:'+T[m[0]].tcd+'">'+esc(T[m[0]].short)+'</span>'+
          '<span class="v'+(loA?" lo":"")+'" style="color:'+T[m[0]].tcd+'">'+(played?A:"")+'</span>'+
          '<span class="d">'+(played?"&ndash;":"v")+'</span>'+
          '<span class="v'+(loB?" lo":"")+'" style="color:'+T[m[1]].tcd+'">'+(played?B:"")+'</span>'+
          '<span class="b'+(loB?" lo":"")+'" style="color:'+T[m[1]].tcd+'">'+esc(T[m[1]].short)+'</span>'+
          '</div>';
      }
      h+='<div class="scr'+(r===LIVE()?" live":"")+'"><span class="rnum">'+
         (r===FINALS?"F":(r+1))+'</span><div class="sms">'+lines+'</div></div>';

  }
  const byLine=mvpByLine(); let any=false;
  h+='<div class="prize">$250 Uber Eats / DoorDash gift card &middot; top games-won player in each line</div>';
  byLine.forEach(function(rows,li){
    h+='<div class="mvl"><div class="mvlh">Line '+(li+1)+'<span>top games won</span></div>';
    if(!rows.length) h+='<p class="rnote">Fills in as courts are scored.</p>';

      h+='<div class="sr'+(i===0?" lead":"")+'"><span class="pos n">'+(i+1)+'</span><i class="dot" style="background:'+T[x.ti].c+'"></i>'+

  $("rail").innerHTML=h;
}

/* every round for one player: court, side, partner, opponents, score, state */
function meRounds(n){
  const w=WHERE[n], out=[];
  for(let r=0;r<NR;r++){
    let m0,m1; try{ m0=match(r,0); m1=match(r,1); }catch(e){ out.push({r:r, unknown:true}); continue; }
    const t = (m0[0]===w.ti||m0[1]===w.ti) ? 0 : 1, m = t?m1:m0;
    const side = m[0]===w.ti ? 0 : 1, opp = m[1-side], c = t*3+w.li+1, p = lu(r,c);
    const on = p[side].indexOf(n)>=0, s = sc(r,c), F = fin(r,c);
    const named = p[0].length+p[1].length>0;
    out.push({r:r, c:c, opp:opp, on:on, named:named, partner:on?p[side].filter(x=>x!==n)[0]:null,
              opps:p[1-side], my:s[side], their:s[1-side], F:F, played:F||s[0]||s[1]});
  }
  return out;
}

  const nm=function(x){ return esc(sn(x)); };
  /* where next: the first round from the live one on that the player is named in;

  let next=null;
  for(const x of rows){ if(x.r<L || x.unknown) continue; if(x.on && !x.F){ next=x; break; } }

    list+='<div class="meR '+(x.F?'fin '+res.toLowerCase():'')+'"><span class="meRn">'+lab+tm+'</span>'+
      '<span class="meRt"><b>Court '+cn(x.c)+'</b> &middot; with '+(x.partner?nm(x.partner):'&mdash;')+' <span class="meRv">v</span> '+
      (x.opps.length?x.opps.map(nm).join(" &amp; "):esc(T[x.opp].short))+'</span>'+
      '<span class="meRs n">'+(x.played?x.my+'&ndash;'+x.their:'')+' <em>'+res+'</em></span></div>';
    if(x.r===LUNCH_AFTER) list+=LUNCH_ROW;
  });
  const ph=mePhoto(me);
  const out='<div class="meH" style="--c:'+col+'">'+
    (ph ? '<img class="meAv" alt="" src="'+ph+'">' : '<span class="meAv ini" style="background:'+T[ti].c+';color:'+(T[ti].fg||"#0d0e12")+'">'+esc(meInitials(me))+'</span>')+
    '<span class="meHt"><span class="meSq">'+esc(T[ti].name)+' &middot; Line '+(w.li+1)+'</span>'+
    '<span class="meNm">'+esc(me)+'</span></span></div>'+
    '<div class="meS"><div><b class="n">'+mine.gf+'</b><small>games won</small></div>'+
    '<div><b class="n">'+won+'&ndash;'+lost+'</b><small>courts W&ndash;L</small></div>'+
    '<div><b class="n">'+(mi>=0?'#'+(mi+1):'&mdash;')+'</b><small>MVP &middot; line '+(w.li+1)+'</small></div>'+
    '<div><b class="n">'+(pos||'&mdash;')+'</b><small>squad place</small></div></div>'+
    nextH+'<div class="meL">'+list+'</div>';
  box.innerHTML=out; if(mbox) mbox.innerHTML=out;
  const mp=$("mep"); if(mp) mp.classList.toggle("set", !!me);
}

/* ── interaction ── */
document.addEventListener("click", function(e){
  const id=e.target.id;
  if(id==="findBtn"){ $("ov").hidden=false; $("find").focus(); resPanel(); return; }
  if(id==="ovx" || e.target===$("ov")){ $("ov").hidden=true; return; }
  if(id==="tabT"||id==="tabM"){ tab = id==="tabT" ? "board" : "mvp"; rail(); return; }
  const hp=e.target.closest("[data-p]");
  if(hp){ me=hp.dataset.p; try{localStorage.setItem("cupMe",me);}catch(x){}
          $("find").value=""; $("hits").innerHTML=""; $("meIn").value=""; $("mhits").innerHTML=""; resPanel(); return; }
  if(id==="tvBtn"){ try{ localStorage.setItem("cupTV","0"); }catch(x){}
    try{ location.replace(location.pathname+"#notv"); location.reload(); }catch(x){ location.reload(); }
    return; }
  if(id==="modeBtn"){ if(!canWrite){ askPin(); return; }
    scoring=!scoring;
    try{ localStorage.setItem("cupCtl",scoring?"1":"0"); }catch(x){}
    try{ history.replaceState(null,"",scoring?"#control":"#"); }catch(x){}
    render(); return; }
  if(!canWrite || !scoring) return;
  if(id==="toLive"){ view=LIVE(); pinnedView=false; render(); return; }
  if(id==="pinBtn"){ pinLocal=!pinLocal; pinRound=view; render(); saveUI(); return; }
  if(id==="prBtn"){ state.pr=!state.pr; touch(); return; }
  if(id==="stBtn"){ state.st = state.st===1?2:1; touch(); return; }
  const qb=e.target.closest("[data-set]");
  if(qb){ const a=qb.dataset.set.split("|"), rr=+a[0], cc=+a[1], sd=+a[2], vv=+a[3], k=key(rr,cc);
    const cur=sc(rr,cc); cur[sd]=vv; state.s[k]=cur;
    /* first to six ends the set, so the court settles itself; tapping a
       different number reopens it. one tap per side, no confirm step. */
    if(cur[0]===TARGET||cur[1]===TARGET) state.f[k]=1; else delete state.f[k];
    touch(); return; }
  const rd=e.target.closest("[data-r]");
  if(rd){ view=+rd.dataset.r; pinnedView=true; render(); saveUI(); return; }
  const lb=e.target.closest("[data-lu]");
  if(lb){ if(lb.disabled) return;
    const a=lb.dataset.lu.split("|"), r=+a[0], c=+a[1], side=+a[2], n=lb.dataset.n, k=key(r,c);
    const cur=state.lu[k]||[[],[]], arr=cur[side].slice(), at=arr.indexOf(n);
    if(at>=0) arr.splice(at,1);
    else {
      arr.push(n); if(arr.length>2) arr.shift();
      {                                              // re-check before committing
        const m=match(r,(c-1)/3|0), ti=m[side], l=(c-1)%3, info=lineInfo(ti,l);
        if(info.fiveOK){
          const trial=info.slots.map((x,i)=>i===r?arr:x);
          if(!legal(trial,LN[ti][l],false,info.maxSit)) return;
          if(state.pr && info.pairOK && !legal(trial,LN[ti][l],true,info.maxSit)) return;
        }
      }
    }
    cur[side]=arr; state.lu[k]=cur; touch(); return; }
  const b=e.target.closest("[data-a]");
  if(b){ const c=+b.dataset.c, k=key(view,c), a=b.dataset.a;
    if(a==="fin"){ if(state.f[k]) delete state.f[k]; else state.f[k]=1; }
    touch(); }
});
$("meIn").addEventListener("input", function(){
  const q=this.value.trim().toLowerCase();
  $("mhits").innerHTML = q ? ALL.filter(n=>n.toLowerCase().indexOf(q)>=0).slice(0,6)
    .map(n=>'<button data-p="'+esc(n)+'">'+esc(n)+'</button>').join("") : "";
});
if(/\byou\b/i.test(location.hash)){ setTimeout(function(){
  if(me) return; /* already picked a name on this phone: nothing to do */
  if(document.body.classList.contains("phone")){ const i=$("meIn"); if(i){ i.scrollIntoView({block:"start"}); i.focus(); } }
  else { const b=$("findBtn"); if(b) b.click(); }
}, 900); }
document.addEventListener("click", function(e){
  if(e.target && e.target.id==="meClr"){ me=null; try{localStorage.removeItem("cupMe");}catch(x){} $("meIn").value=""; $("mhits").innerHTML=""; resPanel(); $("meIn").focus(); }
});
$("find").addEventListener("input", function(){
  const q=this.value.trim().toLowerCase();
  $("hits").innerHTML = q ? ALL.filter(n=>n.toLowerCase().indexOf(q)>=0).slice(0,6)
    .map(n=>'<button data-p="'+esc(n)+'">'+esc(n)+'</button>').join("") : "";
});
try{ const sv=localStorage.getItem("cupMe"); if(sv&&ALL.indexOf(sv)>=0) me=sv; }catch(e){}
/* The display is a TV browser that can only be given a URL - no keyboard, no
   pointer, not signed in. So the mode lives in the URL, not in stored state
   the TV has no way to change: "<url>#control" is the scoring console, the
   bare URL is the board. A viewer that cannot publish is never the console. */
/* A TV browser is usually handed a bare URL and many of them drop the
   #fragment on the next load, on wake, or after a power cut - which would
   silently demote the club screen to the phone layout with nobody there to
   notice. So being the TV is remembered on that device: point a screen at the
   TV link once and it stays the TV for good. The query string is honoured too
   ("?tv"), because the wrappers that eat a fragment often keep a query.
   "#notv" clears it, and a phone that opened the TV link by mistake gets an
   exit button, so nothing is ever stuck. */
const LOC = location.hash + location.search;
let tvSticky = false;
try{ tvSticky = localStorage.getItem("cupTV")==="1"; }catch(e){}
if(/notv|nokiosk/i.test(LOC)){ tvSticky=false; try{ localStorage.setItem("cupTV","0"); }catch(e){} }
else if(/tv|kiosk/i.test(LOC)){ tvSticky=true;  try{ localStorage.setItem("cupTV","1"); }catch(e){} }
const KIOSK = tvSticky || /show/i.test(LOC);   /* the club TV; a phone is not */
scoring = /control/i.test(location.hash);
if(scoring){ try{ localStorage.setItem("cupCtl","1"); }catch(e){} }
else { try{ if(localStorage.getItem("cupCtl")==="1") scoring=true; }catch(e){} }

/* ── persistence ── */
const CACHE="cupDraft";
let draft=null, wl=null;
function conn(t,on){ $("conn").textContent=t; $("dot").className=on?"on":""; }
function cache(){ try{ localStorage.setItem(CACHE,
  JSON.stringify({t:Date.now(),s:state.s,f:state.f,lu:state.lu})); }catch(e){} }

/* Wifi at a padel club is not a promise. Every entry is mirrored to this
   device before it is published, so a dropped connection, a killed tab or a
   flat battery costs nothing: the scores are offered back on the next load. */
function diffKeys(d){
  const seen={}, out=[];
  for(const k in (d.s||{})){ const a=d.s[k], b=state.s[k];
    if(!b || a[0]!==b[0] || a[1]!==b[1]) seen[k]=1; }
  for(const k in (d.f||{})) if(!state.f[k]) seen[k]=1;
  for(const k in (d.lu||{})) if(JSON.stringify(d.lu[k])!==JSON.stringify(lu(+k.split("|")[0],+k.split("|")[1]))) seen[k]=1;
  for(const k in seen) out.push(k);
  out.sort(); return out;
}
function recover(){
  if(!canWrite) return;
  try{ draft=JSON.parse(localStorage.getItem(CACHE)||"null"); }catch(e){ draft=null; }
  if(!draft) return;
  const ks=diffKeys(draft); if(!ks.length){ draft=null; return; }
  const mins=Math.max(1,Math.round((Date.now()-(draft.t||0))/60000));
  const where=ks.slice(0,6).map(k=>{const a=k.split("|");
    return "R"+(+a[0]===FINALS?"F":+a[0]+1)+" C"+cn(+a[1]);}).join(", ")+(ks.length>6?"…":"");
  $("rec").hidden=false;
  $("rec").innerHTML='<span><b>'+ks.length+' court'+(ks.length===1?"":"s")+
    '</b> scored on this device '+mins+' min ago never reached the scoreboard &middot; '+esc(where)+
    '</span><button id="recYes">Restore</button><button class="ghost" id="recNo">Discard</button>';
}
document.addEventListener("click", function(e){
  if(e.target.id==="recYes" && draft){
    for(const k in (draft.s||{})) state.s[k]=draft.s[k];
    for(const k in (draft.f||{})) state.f[k]=draft.f[k];
    for(const k in (draft.lu||{})) state.lu[k]=draft.lu[k];
    draft=null; $("rec").hidden=true; touch(); return;
  }
  if(e.target.id==="recNo"){ draft=null; $("rec").hidden=true;
    try{ localStorage.removeItem(CACHE); }catch(x){} cache(); }
});

/* A TV that sleeps mid-tie is a scoreboard nobody can read. */
async function keepAwake(){
  try{
    const want = document.body.classList.contains("tv") && document.visibilityState==="visible";
    if(want && !wl && navigator.wakeLock){ wl = await navigator.wakeLock.request("screen");
      wl.addEventListener("release", function(){ wl=null; }); }
    else if(!want && wl){ await wl.release(); wl=null; }
  }catch(e){ wl=null; }
}
document.addEventListener("visibilitychange", keepAwake);
window.addEventListener("online", function(){ if(dirty&&canWrite){ clearTimeout(timer); timer=setTimeout(flush,300); } });
window.addEventListener("offline", function(){ if(canWrite&&dirty) conn("offline",false); });

function touch(){
  render();
  if(!canWrite) return;
  cache();
  const L=LIVE(); if(L!==lastLive){ lastLive=L; if(!pinnedView && !scoring){ view=L; render(); } }
  dirty=true; conn("unsaved",false);
  clearTimeout(timer); timer=setTimeout(flush,1600);
}
async function flush(){
  if(inflight||!dirty||!canWrite) return;
  inflight=true; dirty=false; conn("saving",true);
  /* the round pin is deliberately NOT published: a pin left on by the scorer
     would otherwise freeze every TV on an old round with no way to clear it */
  const pub={v:3, s:state.s, f:state.f, lu:state.lu, pr:state.pr, st:state.st, show:!!state.show};
  saveUI();
  try{
    await sbRpc("cup_write",{p_key:"scores", p_doc:pub, p_pin:pin});
    lastSig=JSON.stringify([pub.s,pub.f,pub.lu]);
    conn("saved",true);
  }
  catch(err){ inflight=false; dirty=true;
    if(err&&err.code==="badpin"){ conn("bad pin",false); forgetPin(); askPin(); return; }
    conn(navigator.onLine?"retrying":"offline",false);
    clearTimeout(timer); timer=setTimeout(flush,4000); return; }
  inflight=false;
  if(dirty){ clearTimeout(timer); timer=setTimeout(flush,800); }
}
/* Nothing reloads the page any more; the scorer's place is still remembered
   across an accidental refresh (harmless otherwise). */
const UI_KEY="cupUI";
function saveUI(){
  if(!(canWrite&&scoring)) return;
  try{ localStorage.setItem(UI_KEY, JSON.stringify({t:Date.now(), view:view, pinLocal:pinLocal,
        pinRound:pinRound, y:window.scrollY||window.pageYOffset||0})); }catch(e){}
}
function restoreUI(){
  if(!(canWrite&&scoring)) return;
  let u=null; try{ u=JSON.parse(localStorage.getItem(UI_KEY)||"null"); }catch(e){}
  if(!u || Date.now()-(u.t||0) > 120000) return;      /* only a reload that just happened */
  if(typeof u.view==="number" && u.view>=0 && u.view<NR){ view=u.view; pinnedView=(u.view!==LIVE()); }
  if(u.pinLocal){ pinLocal=true; pinRound=u.pinRound||u.view; }
  render();
  const y=u.y||0;
  const back=function(){ window.scrollTo(0,y); };
  back(); requestAnimationFrame(back); setTimeout(back,250); setTimeout(back,900);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(back);
}
let uiT=null;
window.addEventListener("scroll", function(){ clearTimeout(uiT); uiT=setTimeout(saveUI,300); }, {passive:true});
window.addEventListener("beforeunload", function(e){
  if(dirty){ e.preventDefault(); e.returnValue=""; } });

/* ── keeping every screen current ─────────────────────────────────────────
   Every view polls the two light rows (scores, roster) every 3 s and swaps in
   any newer scores without a flash. Realtime (supabase-js, optional) applies
   updates the moment they land; polling stays as the fallback. A console with
   unsaved taps never lets the poll overwrite them. */
let lastSeen=Date.now(), pollFails=0, lastSig="";
function sig(){ return JSON.stringify([state.s,state.f,state.lu]); }
function clock(){ const c=$("hclock"); if(!c) return; const d=new Date(), p=n=>String(n).padStart(2,"0"); c.textContent=p(d.getHours())+":"+p(d.getMinutes()); }
setInterval(clock,10000); clock();
function stamp(){
  if(canWrite) return;
  const age=Math.round((Date.now()-lastSeen)/1000), d=new Date(lastSeen);
  const p=n=>String(n).padStart(2,"0");
  conn("updated "+p(d.getHours())+":"+p(d.getMinutes()), age<90);
}
function applyScores(d){
  if(!d||typeof d!=="object") return;
  if(canWrite && (dirty||inflight)) return;      /* local taps win until they are saved */
  state.show = d.show===true;
  const ns=JSON.stringify([d.s||{},d.f||{},d.lu||{}]);
  if(ns!==lastSig){
    lastSig=ns;
    state.s=d.s||{}; state.f=d.f||{}; state.lu=d.lu||{};
    if(d.st===1||d.st===2) state.st=d.st;
    if(typeof d.pr==="boolean") state.pr=d.pr;
    render();
  } else if(canWrite && scoring){
    if((d.st===1||d.st===2) && d.st!==state.st){ state.st=d.st; render(); }
    if(typeof d.pr==="boolean" && d.pr!==state.pr){ state.pr=d.pr; render(); }
  }
}
function applyRows(rows){
  if(rows.scores) applyScores(rows.scores.doc);
  if(rows.roster && typeof applyRosterDoc==="function") applyRosterDoc(rows.roster.doc);
  let got=false;
  DECK_KEYS.forEach(function(k){ const r=rows["deck_"+k]; if(r&&r.doc&&typeof r.doc==="object"){
    deckState[k]={photos:r.doc.photos||{}, facts:r.doc.facts||{}}; got=true; } });
  if(got && !decksLoaded){ decksLoaded=true; if(typeof decksReady==="function") decksReady(); if(me && typeof resPanel==="function") resPanel(); }
  else if(got && typeof decksChanged==="function") decksChanged();
  if(got && me && typeof resPanel==="function") resPanel();
}
let inPull=false;
async function pull(){
  if(inPull) return;
  inPull=true;
  try{
    const rows=await sbGet(decksLoaded ? ["scores","roster"] : null, decksLoaded ? 8000 : 20000);
    pollFails=0; lastSeen=Date.now();
    applyRows(rows);
    stamp();
  }catch(err){
    pollFails++;
    if(!canWrite || !(dirty||inflight)) conn("reconnecting",false);
  }finally{ inPull=false; }
}
/* boot: one full read (all keys); if it fails the page renders from the empty
   defaults and the poll keeps retrying (with the decks) until it succeeds */
async function boot(){
  for(let i=0;i<3;i++){
    try{ const rows=await sbGet(null,20000); lastSeen=Date.now(); applyRows(rows); stamp(); return true; }
    catch(e){ conn("reconnecting",false); await new Promise(r=>setTimeout(r,1500)); }
  }
  return false;
}
/* optional realtime: apply UPDATE events immediately */
function realtime(){
  try{
    if(!/^https:/.test(SB_URL)) return;
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
    s.async=true;
    s.onload=function(){
      try{
        if(!window.supabase||!window.supabase.createClient) return;
        const cl=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
        cl.channel("cup_state").on("postgres_changes",{event:"UPDATE",schema:"public",table:"cup_state"},function(p){
          const row=p&&p.new; if(!row||!row.key) return;
          const rows={}; rows[row.key]=row; lastSeen=Date.now(); pollFails=0; applyRows(rows); stamp();
        }).subscribe();
      }catch(e){}
    };
    document.head.appendChild(s);
  }catch(e){}
}
/* ── PIN gate ── */
function askPin(){ const o=$("pinov"); if(!o) return; o.hidden=false; $("pinErr").textContent=""; $("pinIn").value="";
  try{ $("pinIn").focus(); }catch(e){} }
function forgetPin(){ pin=null; canWrite=false; try{ localStorage.removeItem("cupPin"); }catch(e){}
  const b=$("deckBtn"); if(b) b.hidden=true; render(); }
async function checkPin(p){ const r=await sbRpc("cup_check_pin",{p_pin:p}); return r===true; }
function grantWrite(){
  canWrite=true; render(); conn("live",true); restoreUI(); recover();
  const b=$("deckBtn"); if(b) b.hidden=false;
  if(dirty){ clearTimeout(timer); timer=setTimeout(flush,300); }
}
async function pinSubmit(){
  const p=$("pinIn").value.trim(); if(!p){ $("pinErr").textContent="Enter the PIN"; return; }
  $("pinErr").textContent="checking\u2026";
  let ok=false;
  try{ ok=await checkPin(p); }catch(e){ $("pinErr").textContent="Could not check the PIN \u2013 are you online?"; return; }
  if(!ok){ $("pinErr").textContent="Wrong PIN"; $("pinIn").value=""; try{ $("pinIn").focus(); }catch(x){} return; }
  pin=p; try{ localStorage.setItem("cupPin",p); }catch(e){}
  $("pinov").hidden=true;
  scoring=true; try{ localStorage.setItem("cupCtl","1"); }catch(e){}
  try{ history.replaceState(null,"","#control"); }catch(e){}
  grantWrite();
}
document.addEventListener("click", function(e){
  const id=e.target.id;
  if(id==="pinSave"){ pinSubmit(); return; }
  if(id==="pinCancel" || e.target===$("pinov")){ $("pinov").hidden=true;
    if(!canWrite){ scoring=false; try{ localStorage.setItem("cupCtl","0"); }catch(x){}
      try{ if(/control/i.test(location.hash)) history.replaceState(null,"","#"); }catch(x){} render(); } }
});
$("pinIn").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); pinSubmit(); } });
/* a stored PIN is re-checked at boot; a network hiccup just retries */
async function pinBoot(){
  let p=null; try{ p=localStorage.getItem("cupPin"); }catch(e){}
  if(!p) return false;
  for(let i=0;i<5;i++){
    try{ const ok=await checkPin(p); if(ok){ pin=p; return true; } forgetPin(); return false; }
    catch(e){ await new Promise(r=>setTimeout(r,2000)); }
  }
  return false;
}
function rotateRail(){ if(canWrite||!KIOSK) return;
  tab = TABS[(TABS.indexOf(tab)+1) % TABS.length]; rail(); }

lastLive=LIVE(); lastSig=sig(); render();
(async ()=>{
  await boot();
  if(await pinBoot()){ grantWrite(); }
  else { canWrite=false; render(); if(scoring) askPin(); }
  if(!canWrite) stamp();
  setInterval(pull,3000); setInterval(stamp,15000); setInterval(rotateRail,30000);
  realtime();
})();
</script>

show(idx+(d<0?1:-1)); tx=null; },{passive:true});\n\n/* photo: resized on this device, embedded in the page, published back */\nconst picker=document.createElement(\"input\");\npicker.type=\"file\"; picker.accept=\"image/*\"; picker.hidden=true;\ndocument.body.appendChild(picker);\nlet target=null;\ndocument.addEventListener(\"click\",ev=>{\n  const ph=ev.target.closest(\"[data-photo]\");\n  if(ph && canWrite){ target=ph.closest(\".slide\").dataset.name; picker.value=\"\"; picker.click(); }\n});\npicker.onchange=function(){\n  const f=picker.files&&picker.files[0]; if(!f||!target) return;\n  const nm=target, fr=new FileReader();\n  fr.onload=function(){\n    const im=new Image();\n    im.onload=function(){\n      const S=480, r=Math.min(S/im.width,S/im.height,1);\n      const w=Math.round(im.width*r), h=Math.round(im.height*r);\n      const cv=document.createElement(\"canvas\"); cv.width=w; cv.height=h;\n      cv.getContext(\"2d\").drawImage(im,0,0,w,h);\n      state.photos[nm]=cv.toDataURL(\"image/jpeg\",0.62);\n      paint(); touch();\n    };\n    im.src=fr.result;\n  };\n  fr.readAsDataURL(f);\n};\ndocument.addEventListener(\"blur\",ev=>{\n  const el=ev.target.closest&&ev.target.closest(\"[data-fact]\");\n  if(!el||!canWrite) return;\n  const nm=el.closest(\".slide\").dataset.name, i=el.dataset.fact;\n  const v=el.querySelector(\".ftxt\").textContent.trim().slice(0,120);\n  state.facts[nm]=state.facts[nm]||{};\n  if(state.facts[nm][i]===v) return;\n  state.facts[nm][i]=v; el.classList.toggle(\"empty\",!v); touch();\n},true);\n\nfunction note(t){ const n=document.getElementById(\"save\"); if(n){ n.textContent=t; n.hidden=!t; } }\nfunction touch(){ dirty=true; note(\"unsaved\"); clearTimeout(timer); timer=setTimeout(flush,1200); }\nasync function flush(){\n  if(inflight||!dirty||!canWrite) return;\n  inflight=true; dirty=false; note(\"saving\");\n  const body=TEMPLATE.replace(STATE_RE,(_,a,b)=>a+JSON.stringify(state)+b);\n  try{ await artifact.publish(body); note(\"saved\"); setTimeout(()=>note(\"\"),1600); }\n  catch(err){ inflight=false; if(err&&err.code===\"conflict\"){ note(\"reloading\"); return; }\n    dirty=true; note(\"retrying\"); clearTimeout(timer); timer=setTimeout(flush,4000); return; }\n  inflight=false; if(dirty){ clearTimeout(timer); timer=setTimeout(flush,800); }\n}\naddEventListener(\"beforeunload\",e=>{ if(dirty){ e.preventDefault(); e.returnValue=\"\"; } });\n\nshow(0); paint();\n(async()=>{ artifact = await claude.use(\"artifact\");\n  canWrite = !!artifact; paint();\n  const h=document.getElementById(\"hint\");\n  if(h) h.textContent = canWrite ? \"Tap the photo to add a picture \u00b7 tap any dashed line or the quote bar to type\"\n                                 : \"\";\n})();\n<\/script>\n<style>body:not(.edit) .hud,body:not(.edit) .prog{display:none!important}.slide.p .quote{padding-bottom:3cqh}body{overflow:hidden}</style><script>window.__api={get state(){return state},paint:paint,show:show,n:function(){return slides.length},idx:function(){return idx},edit:function(on){document.body.classList.toggle(\"edit\",!!on)}};<\/script></body></html>"</script>

<script>
/* ── team show ─────────────────────────────────────────────────────────────
   Cycles the four team decks, then the live board, on a loop. Three ways in,
   because the TV may be given nothing but a URL and the claude.ai wrapper
   does not always pass a #hash through to the page:
     1. <url>#show (or ?show)            2. the "Team show" button (remembered on
     that screen)                        3. the scoring console's "TV show" switch,
     which publishes show:true in cup-state so every anonymous wide screen picks
     it up on its next poll - phones (narrow) are never taken over.           */
const DECK_STATE_RE = /(<script id="deck-state" type="application\/json">)[\s\S]*?(<\/script>)/;
let roster = (function(){ try{ return JSON.parse($("roster-state").textContent).facts||{}; }catch(e){ return {}; } })();
let rosterSig = JSON.stringify(roster);
const frames = {};
let showOn = false, showTimer = null, showLocal = null;
/* cup-noshow: not remembered across reloads */

function deckApi(k){ try{ return frames[k] && frames[k].contentWindow.__api || null; }catch(e){ return null; } }
function applyRoster(k){
  const api = deckApi(k); if(!api) return;
  const f = api.state.facts;
  Object.keys(roster).forEach(function(nm){ f[nm] = Object.assign({}, f[nm]||{}, roster[nm]); });
  api.paint();
}
function applyRosterDoc(d){
  try{
    const nf = (d&&d.facts)||{}, ns = JSON.stringify(nf);
    if(ns!==rosterSig){ roster = nf; rosterSig = ns; DECK_KEYS.forEach(applyRoster); }
  }catch(e){}
}
function wantShow(){ return false; } /* cup-nocards: no player cards on the board, ever */
function deckDoc(k){
  const el = $("deckdoc-"+k); if(!el) return null;
  const st = deckState[k] || {photos:{}, facts:{}};
  const js = JSON.stringify(st).replace(/<\/script/gi, "<\\/script");
  return JSON.parse(el.textContent).replace(DECK_STATE_RE, function(_,a,b){ return a+js+b; });
}
/* frames are only built once the deck states have arrived; until then the
   show waits on the board and the editor waits on its spinner */
function addFrames(){
  const box=$("show"); if(!box || !decksLoaded) return;
  DECK_KEYS.forEach(function(k){
    if(frames[k]) return;
    const doc = deckDoc(k); if(!doc) return;
    const fr = document.createElement("iframe"); fr.setAttribute("title", k); fr.setAttribute("scrolling","no");
    fr.srcdoc = doc; box.appendChild(fr); frames[k] = fr;
  });
}
function ensureFrames(){
  if($("show")){ addFrames(); return; }
  const box = document.createElement("div"); box.id = "show"; document.body.appendChild(box);
  addFrames();
}
function decksReady(){ addFrames(); if(editing && editKey){ Object.keys(frames).forEach(function(x){ frames[x].classList.toggle("on", x===editKey); }); } }
/* a deck saved elsewhere: idle frames pick it up; a frame mid-show or being edited is left alone */
function decksChanged(){
  if(editing) return;
  DECK_KEYS.forEach(function(k){
    const fr=frames[k]; if(!fr || fr.classList.contains("on")) return;
    const api=deckApi(k); if(!api) return;
    const st=deckState[k]; if(!st) return;
    if(JSON.stringify({photos:api.state.photos,facts:api.state.facts})===JSON.stringify(st)) return;
    fr.remove(); delete frames[k]; addFrames();
  });
}
const T_SHOW = {cover:5, player:8, roster:10, board:20};
let di = 0, si = 0, phase = "deck", waits = 0;
function step(){
  if(!showOn) return;
  let wait;
  if(phase==="board"){
    document.body.classList.remove("showing");
    wait = T_SHOW.board; phase = "deck"; di = (di+1) % DECK_KEYS.length; si = 0; waits = 0;
  } else {
    const k = DECK_KEYS[di], api = deckApi(k);
    if(!api){ /* frame still loading: wait, and after ~30s give up on it via the board */
      wait = 0.5; if(++waits > 60){ phase = "board"; wait = 0; }
    } else {
      const n = api.n();
      if(si===0) applyRoster(k);
      Object.keys(frames).forEach(function(x){ frames[x].classList.toggle("on", x===k); });
      document.body.classList.add("showing");
      api.show(si);
      wait = si===0 ? T_SHOW.cover : (si===n-1 ? T_SHOW.roster : T_SHOW.player);
      si++;
      if(si>=n){ phase = "board"; }
    }
  }
  showTimer = setTimeout(step, wait*1000);
}
function syncShow(){
  const want = editing ? false : wantShow();
  
  if(want===showOn) return;
  showOn = want;
  clearTimeout(showTimer);
  if(showOn){ ensureFrames(); di=0; si=0; phase="deck"; waits=0; step(); }
  else { document.body.classList.remove("showing"); }
}
document.addEventListener("click", function(e){
  if(e.target.id==="showBtn" || (e.target.id==="show" && !editing)){ showLocal = showOn ? "0" : "1";   /* a tap on the show itself stops it */
    syncShow(); }
  if(e.target.id==="tvShowBtn" && canWrite){ state.show = !state.show; touch(); }
});
addEventListener("hashchange", syncShow);
addEventListener("keydown", function(e){ if(e.key==="Escape" && showOn){ showLocal="0"; syncShow(); } });

/* ── Decks editor ─────────────────────────────────────────────────────────
   The four team decks live INSIDE this page. With a PIN: "Decks" opens each
   one with its own photo/fact editor; the deck "publishes" through this page,
   which lifts the deck-state JSON out of the body and writes it to Supabase
   (cup_write deck_<key>). No reload: the in-memory state is updated too.  */
const DECK_NAMES = {fries:"Sexy Fries", punjabi:"Punjabi 69ers", samosas:"Deconstructed Samosas", naans:"Naughty Naans"};
let editing = false, editKey = null;
function killFrames(){ const b=$("show"); if(b) b.remove(); Object.keys(frames).forEach(function(k){ delete frames[k]; }); }
function openEditor(key, idx){
  if(!canWrite) return;
  if(showOn){ showLocal="0"; syncShow(); }
  editing = true; editKey = key || DECK_KEYS[0]; killFrames(); ensureFrames();
  const box=$("show");
  const bar=document.createElement("div"); bar.id="dbar";
  bar.innerHTML = DECK_KEYS.map(function(k){ return '<button data-deck="'+k+'"'+(k===editKey?' class="on"':'')+'>'+DECK_NAMES[k]+'</button>'; }).join("")+
    '<span class="sp"></span><span class="st" id="dst">tap a photo frame or a blank line to edit &middot; saves go live straight away</span>'+
    '<button id="dclose">Close</button>';
  box.insertBefore(bar, box.firstChild);
  document.body.classList.add("editing");
  Object.keys(frames).forEach(function(x){ frames[x].classList.toggle("on", x===editKey); });
  const want = (typeof idx==="number") ? idx : 0;
  (function wait(n){ const api=deckApi(editKey); if(api){ api.edit(true); api.show(want); } else if(n<80) setTimeout(function(){ wait(n+1); },250); })(0);
  $("deckBtn").classList.add("on");
}
function closeEditor(){
  editing=false; editKey=null; document.body.classList.remove("editing"); killFrames();
  const b=$("deckBtn"); if(b) b.classList.remove("on");
}
document.addEventListener("click", function(e){
  if(e.target.id==="deckBtn"){ editing ? closeEditor() : openEditor(); return; }
  if(e.target.id==="dclose"){ closeEditor(); return; }
  const db=e.target.closest("[data-deck]");
  if(db && editing){ editKey=db.dataset.deck;
    document.querySelectorAll("#dbar [data-deck]").forEach(function(b){ b.classList.toggle("on", b.dataset.deck===editKey); });
    Object.keys(frames).forEach(function(x){ frames[x].classList.toggle("on", x===editKey); });
    const api=deckApi(editKey); if(api){ api.edit(true); } }
});
addEventListener("message", async function(e){
  const d=e.data; if(!d||typeof d!=="object"||!e.source) return;
  if(d.t==="cup-can-write"){ e.source.postMessage({t:"cup-can-write", id:d.id, ok:!!(canWrite&&editing)}, "*"); return; }
  if(d.t!=="cup-publish") return;
  const reply=function(ok,err){ try{ e.source.postMessage({t:"cup-published", id:d.id, ok:ok, err:err}, "*"); }catch(x){} };
  if(!(canWrite&&editing&&pin) || DECK_KEYS.indexOf(d.deck)<0){ reply(false,{code:"readonly"}); return; }
  const st=$("dst");
  try{
    const sm = String(d.body).match(/<script id="deck-state" type="application\/json">([\s\S]*?)<\/script>/);
    if(!sm) throw new Error("no deck-state in body");
    const ds = JSON.parse(sm[1].replace(/<\\\/script/g,"</script"));
    const doc = {photos: ds.photos||{}, facts: ds.facts||{}};
    if(st) st.textContent="saving\u2026";
    await sbRpc("cup_write",{p_key:"deck_"+d.deck, p_doc:doc, p_pin:pin}, 30000);
    deckState[d.deck]=doc;
    if(st) st.textContent="saved";
    reply(true);
  }catch(err){
    if(st) st.textContent = (err&&err.code==="badpin") ? "wrong PIN - enter it again" : "save failed - try again";
    reply(false,{code:(err&&err.code)||"error"});
    if(err&&err.code==="badpin"){ closeEditor(); forgetPin(); askPin(); }
  }
});
setInterval(function(){ const b=$("deckBtn"); if(b) b.hidden=!canWrite; }, 3000);
addEventListener("resize", syncShow);
setInterval(syncShow, 3000);
syncShow();
</script>
</body>
</html>
