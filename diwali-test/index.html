:root{
  --bg:#0E0B26; --surface:#1A1640; --sunk:#241F52; --ink:#F4F0FF; --muted:#B0A8D4; --rule:#2F2A63;
  --mari:#FFB627; --flame:#FF6B33; --ok:#4BD397; --bad:#FF7A6E; --wait:#9E96C8;
  --disp:"Citizen Display","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --text:"Citizen Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html.light{ --bg:#F6F3FB; --surface:#FFFFFF; --sunk:#EEE9F6; --ink:#1B1640; --muted:#5D5878; --rule:#DDD6EA; --mari:#B86E00; --flame:#C2401A; --ok:#1F8A5B; --bad:#C2332A; --wait:#6B6590; color-scheme:light }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mari);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:env(safe-area-inset-top)}
.brand{font:800 22px/1 var(--disp)}
.brand span{color:var(--mari)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.off i{background:var(--bad)} .sync.pending i{background:var(--mari)}
h1{font:800 clamp(32px,6vw,52px)/1 var(--disp);margin:14px 0 6px}
h2{font:800 26px/1.05 var(--disp);margin:0 0 10px}
h3{font:800 19px/1.1 var(--disp);margin:0 0 6px}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:12px;padding:14px}
.btn{border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:700;cursor:pointer;background:var(--mari);color:#1B1200}
.btn.alt{background:transparent;border:1px solid var(--rule);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.alt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.now{background:var(--ok);color:#06210F} .pill.wait{background:var(--sunk);color:var(--mari)} .pill.done{background:var(--sunk);color:var(--muted)} .pill.later{background:var(--sunk);color:var(--muted)} .pill.sent{background:var(--sunk);color:var(--ok)}
.lnk{background:none;border:0;padding:4px 0;min-height:32px;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}
.btn.sm{min-height:34px;padding:4px 12px;font-size:14px}
.champ{border-left:6px solid var(--mari);margin-top:12px;font:800 22px/1.2 var(--disp)}
.champ b{color:var(--mari)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:800 26px/1.1 var(--disp);margin-bottom:8px}

/* ---------- TV ---------- */
body.tv{overflow:hidden;height:100vh}
.tvw{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:1.2vh;padding:2vh 2vw}
.tvhead{display:flex;align-items:baseline;justify-content:space-between;gap:2vw}
.tvhead .brand{font-size:clamp(22px,3.2vw,60px)}
.tvhead .prog{font:800 clamp(16px,1.8vw,34px) var(--disp);color:var(--muted)}
.tvhead .prog b{color:var(--mari)}
.tvmain{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:1.6vw;min-height:0}
.courts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.2vw;min-height:0}
.ct{background:var(--surface);border-radius:1vw;padding:1.1vw 1.2vw;display:flex;flex-direction:column;gap:.6vh;min-height:0;overflow:hidden;border-top:.5vh solid var(--rule)}
.ct.now{border-top-color:var(--ok)} .ct.wait{border-top-color:var(--mari)}
.ct .ch{display:flex;justify-content:space-between;align-items:baseline}
.ct .cn{font:800 clamp(18px,2.6vw,52px)/1 var(--disp)}
.ct .cl{font-size:clamp(11px,1vw,18px);color:var(--muted);font-weight:600}
.side{display:flex;align-items:center;gap:.6vw;min-width:0}
.side .sw{width:1.1vw;height:1.1vw;min-width:10px;min-height:10px}
.side .nm{font-weight:600;font-size:clamp(12px,1.12vw,21px);line-height:1.15;min-width:0;overflow-wrap:anywhere}
.side .sq{font:800 clamp(11px,.95vw,18px) var(--disp);color:var(--muted);letter-spacing:.02em}
.vs{font-size:clamp(10px,.9vw,16px);color:var(--muted);font-weight:700}
.ct .st{margin-top:auto;font-size:clamp(11px,1vw,18px);color:var(--muted)}
.ct .st b{color:var(--ink)}
.ct .nx{font-size:clamp(11px,1vw,18px);color:var(--muted);border-top:1px solid var(--rule);padding-top:.6vh;line-height:1.3}
.rail{display:flex;flex-direction:column;gap:1.2vw;min-height:0}
.rail .card{padding:1.1vw 1.2vw}
.rail h2{font-size:clamp(16px,1.6vw,30px);margin-bottom:.6vh}
.stand{width:100%;border-collapse:collapse;font-size:clamp(12px,1.15vw,22px)}
.stand td{padding:.45vh .3vw;border-bottom:1px solid var(--rule)}
.stand td.r{text-align:right;font-variant-numeric:tabular-nums}
.stand tr:first-child td{font-weight:700}
.mvp div{display:flex;justify-content:space-between;gap:.6vw;font-size:clamp(11px,1.05vw,20px);padding:.35vh 0;border-bottom:1px solid var(--rule)}
.mvp div span:first-child{min-width:0;overflow-wrap:anywhere}
.qr{display:flex;align-items:center;gap:1vw;margin-top:auto}
.qr svg{width:clamp(70px,8vw,170px);height:auto;background:#fff;border-radius:.6vw;padding:.4vw;flex:none}
.qr p{margin:0;font-size:clamp(12px,1.1vw,22px);font-weight:600}

/* ---------- player page ---------- */
.search{width:100%;min-height:48px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);padding:10px 18px;font-size:17px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
.names button{display:flex;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-height:48px;cursor:pointer}
.names button:hover{border-color:var(--mari)}
.next{background:var(--surface);border-radius:14px;padding:18px;border-left:6px solid var(--ok);margin:12px 0 18px}
.next.wait{border-left-color:var(--mari)} .next.done{border-left-color:var(--muted)}
.next .big{font:800 clamp(30px,7vw,48px)/1 var(--disp)}
.mlist{display:grid;gap:8px}
.m{background:var(--surface);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.m .ctn{font:800 26px/1 var(--disp);text-align:center;min-width:52px}
.m .ctn small{display:block;font:600 11px var(--text);color:var(--muted)}
.m .who{font-size:15px;min-width:0}
.m .who b{font-weight:600}
.m .sc{font:800 24px var(--disp);text-align:right}
.m.me-done{opacity:.75}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.grid2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.grid2>*{min-width:0}

/* ---------- control ---------- */
.ctl-courts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.cc{background:var(--surface);border-radius:12px;padding:14px;border-top:5px solid var(--rule)}
.cc.now{border-top-color:var(--ok)} .cc.wait{border-top-color:var(--mari)}
.cc .row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.cc .row .side{flex:1 1 140px}
.wrap.ctl{max-width:1400px}
.wrap.ctl h1{font-size:30px;margin:8px 0 0}
@media (min-width:1000px){.ctl-courts.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cc .pick button{width:36px;height:36px;font-size:17px}
.tc{border:1px solid var(--rule);border-radius:10px;padding:6px 10px;margin:6px 0 8px}
.tch{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ok)}
.tci{padding:4px 0}.tci+.tci{border-top:1px solid var(--rule)}
.cur{font-weight:700;margin-top:4px}
.ccf{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:4px}
#editor{max-width:660px}
.cirow{display:flex;gap:6px;margin-top:4px}.cirow [data-ci]{flex:1}
.pick{display:flex;gap:4px;flex-wrap:wrap}
.pick button{width:40px;height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sunk);font:800 18px var(--disp);cursor:pointer}
.pick button[aria-pressed=true]{background:var(--mari);color:#1B1200;border-color:var(--mari)}
.msg{font-size:14px;margin-top:6px;min-height:20px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
table.all{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
table.all th,table.all td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
table.all th{font:800 14px var(--disp);color:var(--muted)}
.tw{overflow-x:auto}
textarea{width:100%;min-height:160px;border:1px solid var(--rule);border-radius:10px;background:var(--sunk);padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
input.pin{min-height:48px;border:1px solid var(--rule);border-radius:10px;background:var(--sunk);padding:8px 14px;font-size:20px;width:140px;letter-spacing:.2em}

/* ---------- posters (print) ---------- */
.poster{background:#fff;color:#111;border-radius:10px;padding:28px;margin-bottom:20px}
.poster h1{color:#111;font-size:56px;margin:0}
.poster .sub{font:700 18px var(--text);color:#444;margin:6px 0 16px}
.poster table{width:100%;border-collapse:collapse;font-size:16px}
.poster th,.poster td{border-bottom:1.5px solid #ccc;padding:9px 8px;text-align:left;vertical-align:top}
.poster th{font:800 15px var(--disp);color:#444}
.poster td.o{font:800 26px var(--disp);width:56px}
.poster .score{width:110px;border-left:1.5px solid #ccc}
.poster .rule{font-size:13px;color:#444;margin-top:12px}
.poster.squad table{font-size:13px} .poster.squad td,.poster.squad th{padding:4px 6px} .poster.squad h3{margin:8px 0 2px!important}
.doorqr{text-align:center}
.sheetqr{float:right;display:flex;align-items:center;gap:10px;max-width:250px;font:700 14px/1.25 var(--text);color:#111}
.sheetqr svg{width:1in;height:1in;flex:none}
.doorqr svg{width:420px;max-width:80%;height:auto}
@media print{
  @page{size:letter portrait;margin:12mm}
  html,body{background:#fff!important;color:#111}
  .noprint{display:none!important}
  .poster{page-break-after:always;border-radius:0;padding:0;margin:0}
  .wrap{padding:0;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body.is-test::before{content:"TEST SCOREBOARD \00B7  practice data only, not the real Cup";display:block;background:#E86223;color:#fff;text-align:center;font-weight:700;padding:7px 12px;font-size:14px;letter-spacing:.03em}
body.tv.is-test::before{position:fixed;top:0;left:0;right:0;z-index:50;padding:2px 8px;font-size:12px;opacity:.92}

<script>
(function(){
"use strict";
const SB_URL = "https://vzgofxsgedmxvdagrono.supabase.co";
const SB_KEY = "sb_publishable_xUDMR5r_5RzNRhcjtObyrA_Ww4gphoU";
const HDR = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY };
/* One source, two builds: the live board (dw_*) and a rehearsal copy (dwt_*) with its own data, PIN and phone storage. */
const TEST = "test" === "test", P = TEST ? "dwt" : "dw";
const BASE = location.origin + location.pathname;
const LS = { pin: P + ".pin", pinok: P + ".pinok", me: P + ".me", queue: P + ".queue", ci: P + ".checkin", ciPending: P + ".checkinPending", cache: P + ".cache" };
const $ = (s, el) => (el || document).querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

/* ---------- state ---------- */
let SETUP = null, SCORES = { s: {}, at: {}, fin: {} }, CHECKINS = {}, RESERVES = {}, REPORTS = {}, online = true, lastSeen = 0, pulled = false;
let editId = null, lastSig = "", deferred = false, repPick = {}, repMsg = {}, qVal = "", handOpen = {}, ffOpen = null, ciMissing = null, pickAt = {};
/* Last good copy of everything, so a reload with no signal still shows squads, scores and check-ins. */
(function loadCache(){ const c = lsGet(LS.cache, null); if (c) { SETUP = c.setup || null; SCORES = Object.assign({ s:{}, at:{}, fin:{} }, c.scores || {}); CHECKINS = c.checkins || {}; RESERVES = c.reserves || {}; REPORTS = c.reports || {}; mergeQueue(); } })();
function saveCache(){ lsSet(LS.cache, { setup: SETUP, scores: SCORES, checkins: CHECKINS, reserves: RESERVES, reports: REPORTS, savedAt: Date.now() }); }
const ord = (n) => n + (["th","st","nd","rd"][((n % 100) - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");
let view = "home", meName = lsGet(LS.me, null), ctlTab = "courts", pickState = {};

/* ---------- model ---------- */
const RR = 9, FINAL = 9;
/* A phone report moves the queue on (the next pair can start), but only a confirmed score counts for standings, MVP and finals. */
const reported = (id) => !!(REPORTS[id] && (REPORTS[id].h || REPORTS[id].a));
const played = (id) => !!SCORES.s[id] || reported(id);
const skipped = () => !!(SCORES.fin && SCORES.fin[0] && SCORES.fin[0].skip);
const present = (n) => !!(CHECKINS[n] || RESERVES[n]);
function buildMatches(){
  if (!SETUP) return [];
  const M = [], C = SETUP.courts || { A:[6,4,2], B:[5,3,1] };
  for (let r = 0; r < RR; r++) for (let t = 0; t < 2; t++) {
    const [h, a] = SETUP.rounds[r][t];
    for (let l = 0; l < 3; l++) M.push({ id:`${r}|${t}|${l}`, r, t, l, court:C[t ? "B" : "A"][l], h, a, hp:SETUP.pairs[r][h][l], ap:SETUP.pairs[r][a][l] });
  }
  if (skipped()) return M;
  const rrDone = M.every((m) => SCORES.s[m.id]);
  const st = standings(M);
  for (let t = 0; t < 2; t++) for (let l = 0; l < 3; l++) {
    const lock = SCORES.fin && SCORES.fin[t] && SCORES.fin[t].h != null ? SCORES.fin[t] : null;   // fixed at the first final score
    const m = { id:`${FINAL}|${t}|${l}`, r:FINAL, t, l, court:C[t ? "B" : "A"][l], final:true, label: t ? "3rd v 4th" : "1st v 2nd", ready: rrDone || !!lock };
    if (lock) { m.h = lock.h; m.a = lock.a; } else if (rrDone) { m.h = st[t * 2].s; m.a = st[t * 2 + 1].s; }
    if (m.h != null) { m.hp = SETUP.pairs[FINAL][m.h][l]; m.ap = SETUP.pairs[FINAL][m.a][l]; }
    M.push(m);
  }
  return M;
}
function standings(M){
  const S = SETUP.teams.map((_, s) => ({ s, gw:0, gl:0, tw:0, tp:0 }));
  const ties = {};
  M.filter((m) => !m.final).forEach((m) => {
    const sc = SCORES.s[m.id]; if (!sc) return;
    S[m.h].gw += sc[0]; S[m.h].gl += sc[1]; S[m.a].gw += sc[1]; S[m.a].gl += sc[0];
    const k = m.r + "|" + m.t; (ties[k] = ties[k] || { h:m.h, a:m.a, n:0, gh:0, ga:0 }); ties[k].n++; ties[k].gh += sc[0]; ties[k].ga += sc[1];
  });
  Object.values(ties).forEach((t) => { if (t.n === 3) { S[t.h].tp++; S[t.a].tp++; if (t.gh > t.ga) S[t.h].tw++; else if (t.ga > t.gh) S[t.a].tw++; } });
  return S.slice().sort((x, y) => (y.gw - x.gw) || ((y.gw - y.gl) - (x.gw - x.gl)) || (y.tw - x.tw) || x.s - y.s);
}
/* Each court plays its own queue in round order. A match is up when everything before it on that court is scored;
   it can start once none of its four players still has an earlier match unscored anywhere. */
function statusAll(M){
  const byCourt = {}; M.forEach((m) => (byCourt[m.court] = byCourt[m.court] || []).push(m));
  Object.values(byCourt).forEach((q) => q.sort((a, b) => a.r - b.r));
  const unscoredBefore = (name, r) => M.find((x) => x.r < r && !played(x.id) && x.hp && x.ap && (x.hp.includes(name) || x.ap.includes(name)));
  const st = {};
  Object.values(byCourt).forEach((q) => {
    let up = false;
    q.forEach((m, i) => {
      if (played(m.id)) { st[m.id] = { k: SCORES.s[m.id] ? "done" : "sent" }; return; }
      if (up) { st[m.id] = { k:"later", pos: i }; return; }
      up = true;
      if (m.final && !m.ready) { const miss = M.filter((x) => !x.final && !SCORES.s[x.id]).sort((a, b) => a.r - b.r || a.court - b.court);
        st[m.id] = { k:"wait", why:`Finals start when every round-robin score is in. Still missing: ${miss.slice(0, 3).map((x) => `court ${x.court}, round ${x.r + 1}`).join("; ")}${miss.length > 3 ? ` and ${miss.length - 3} more` : ""}` }; return; }
      const players = [].concat(m.hp || [], m.ap || []);
      for (const p of players) { const b = unscoredBefore(p, m.r); if (b) { st[m.id] = { k:"wait", why:`Waiting for ${p}, still playing on court ${b.court}`, on:b }; return; } }
      st[m.id] = { k:"now" };
    });
  });
  return { st, byCourt };
}
/* A final tie: total games across its three courts; level totals are settled by the golden-point decider winner (fin[t].w). */
function finalResult(M, t){
  const ms = M.filter((m) => m.final && m.t === t); if (!ms.length || ms.some((m) => !SCORES.s[m.id]) || ms[0].h == null) return null;
  const gh = ms.reduce((a, m) => a + SCORES.s[m.id][0], 0), ga = ms.reduce((a, m) => a + SCORES.s[m.id][1], 0);
  const w = gh > ga ? ms[0].h : ga > gh ? ms[0].a : (SCORES.fin[t] && SCORES.fin[t].w != null ? SCORES.fin[t].w : null);
  return { h: ms[0].h, a: ms[0].a, gh, ga, w, level: gh === ga };
}
/* Champions and third place: from the finals, or from round-robin standings if the finals were skipped. */
function podium(M){
  if (skipped()) { const S = standings(M); return { w: S[0].s, third: S[2].s, skip: true }; }
  const F0 = finalResult(M, 0), F1 = finalResult(M, 1);
  return F0 && F0.w != null ? { w: F0.w, third: F1 && F1.w != null ? F1.w : null } : null;
}
function placing(M, s){
  if (skipped()) return standings(M).findIndex((x) => x.s === s) + 1;
  for (const t of [0, 1]) { const F = finalResult(M, t); if (F && F.w != null && (F.h === s || F.a === s)) return t * 2 + (F.w === s ? 1 : 2); }
  return null;
}
function playerStats(M){
  const P = {};
  M.forEach((m) => { const sc = SCORES.s[m.id]; if (!sc || !m.hp) return;
    [[m.hp, sc[0], sc[1], m.h], [m.ap, sc[1], sc[0], m.a]].forEach(([pair, w, l, s]) => pair.forEach((n) => {
      const x = P[n] = P[n] || { gw:0, gl:0, cw:0, m:0, s }; x.gw += w; x.gl += l; x.m++; if (w > l) x.cw++; })); });
  return P;
}
function lineOf(name){ for (let s = 0; s < 4; s++) for (let l = 0; l < 3; l++) if (SETUP.lines[s][l].includes(name)) return { s, l }; return null; }

  const P = playerStats(M), out = [[],[],[]];
  Object.entries(P).forEach(([n, x]) => { const w = lineOf(n); if (w && !RESERVES[n]) out[w.l].push(Object.assign({ n }, x)); });

  return out;
}
const T = (s) => SETUP.teams[s];
const nick = (s) => T(s).name.split(" ").pop();   // "Deconstructed Samosas" -> "Samosas", for tight scorer lines
const sideHTML = (s, pair, cls) => s == null ? `<div class="side ${cls || ""}"><span class="nm muted">${cls === "f" ? "" : "To be decided"}</span></div>` :
  `<div class="side"><span class="sw" style="background:${esc(T(s).color)}"></span><div><div class="sq">${esc(T(s).name)}</div><div class="nm">${esc(pair ? pair.join(" & ") : "")}</div></div></div>`;

/* ---------- data ---------- */
async function pull(){
  try {
    // A venue wifi with no internet can hang a request for minutes; give up after 8 s so the page can say there's no signal.
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 8000);
    const r = await fetch(SB_URL + `/rest/v1/cup_state?select=key,doc,updated_at&key=in.(${P}_setup,${P}_scores,${P}_checkins,${P}_reports)`, { headers: HDR, cache: "no-store", signal: ac.signal }).finally(() => clearTimeout(to));
    if (!r.ok) throw new Error(r.status);
    const rows = await r.json(); online = true; lastSeen = Date.now();
    rows.forEach((row) => { if (row.key === P + "_setup") SETUP = row.doc; if (row.key === P + "_scores") mergeRemote(row.doc); if (row.key === P + "_checkins") { CHECKINS = (row.doc && row.doc.in) || {}; RESERVES = (row.doc && row.doc.res) || {}; } if (row.key === P + "_reports") REPORTS = (row.doc && row.doc.r) || {}; });
    saveCache();
  } catch(e){ online = false; }
  pulled = true;
  await flush(); await flushCheckin(); renderIfChanged();
}
/* ---------- check-in ---------- */
function todayLA(){ try { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); } catch(e){ return new Date().toISOString().slice(0, 10); } }
const eventDay = () => !!(SETUP && (TEST || (SETUP.date && todayLA() === SETUP.date)));
const clock12 = (iso) => { const m = /T(\d\d):(\d\d)/.exec(iso || ""); if (!m) return ""; let h = +m[1]; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${m[2]} ${ap}`; };
async function checkIn(name, present = true){
  try {
    const r = await rpc(P + "_checkin", { p_name: name, p_present: present });
    if (present) { CHECKINS[name] = (r && r.at) || "yes"; lsSet(LS.ci, { name, date: SETUP.date }); } else { delete CHECKINS[name]; lsSet(LS.ci, null); }
    lsSet(LS.ciPending, null); online = true; return true;
  } catch(e){
    if (/unknown_name|not_today|not_loaded/.test(e.message)) return false;
    lsSet(LS.ciPending, { name, present, date: SETUP.date }); online = false;
    if (present) CHECKINS[name] = CHECKINS[name] || "pending"; return true;
  }
}
async function flushCheckin(){ const p = lsGet(LS.ciPending, null); if (p && SETUP && p.date === SETUP.date) await checkIn(p.name, p.present); }
function checkedInHere(){ const c = lsGet(LS.ci, null); return c && SETUP && c.date === SETUP.date ? c.name : null; }
function mergeRemote(doc){
  SCORES = { s: Object.assign({}, doc.s || {}), at: Object.assign({}, doc.at || {}), fin: JSON.parse(JSON.stringify(doc.fin || {})) };
  mergeQueue();
}
/* Scores entered on this device but not yet confirmed sent always win over the copy just read. */
function mergeQueue(){
  Object.entries(lsGet(LS.queue, {})).forEach(([id, e]) => {
    if (id.startsWith("fin|")) { const t = id.slice(4); SCORES.fin[t] = Object.assign({}, SCORES.fin[t] || {}, e.v); return; }
    if (!SCORES.at[id] || e.at >= SCORES.at[id]) { if (e.v) SCORES.s[id] = e.v; else delete SCORES.s[id]; SCORES.at[id] = e.at; }
  });
}
async function rpc(fn, body){
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, { method:"POST", headers: Object.assign({ "Content-Type":"application/json" }, HDR), body: JSON.stringify(body) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || ("HTTP " + r.status));
  if ((j && j.error) || (typeof j === "string" && j.startsWith("error:"))) throw new Error(j.error || j.slice(7).trim());
  return j;
}
let flushing = false;
async function flush(){
  const q = lsGet(LS.queue, {}), pin = lsGet(LS.pin, null);
  if (flushing || !pin || !Object.keys(q).length) return;
  flushing = true;
  try {
    // Each match goes up on its own and the server applies it atomically, so two scoring devices never overwrite each other.
    for (const [id, e] of Object.entries(q)) {
      await rpc(P + "_score", { p_id: id, p_v: e.v || null, p_at: e.at, p_pin: pin });
      const now = lsGet(LS.queue, {}); if (now[id] && now[id].at === e.at) { delete now[id]; lsSet(LS.queue, now); }
    }
    online = true; saveCache();
  } catch(e){
    // A changed PIN asks for the new one; queued scores stay on this device and send once it's entered.
    if (/bad pin/.test(e.message)) { lsSet(LS.pin, null); online = true; lastSig = ""; } else online = false;
  } finally { flushing = false; }
}
function setScore(id, v){
  const q = lsGet(LS.queue, {}); const at = Date.now();
  q[id] = { v, at };
  // The first score of a final fixes which squads are in it, so later corrections elsewhere can't move it.
  const m = buildMatches().find((x) => x.id === id);
  if (m && m.final && v && !(SCORES.fin[m.t] && SCORES.fin[m.t].h != null)) { const lock = { h: m.h, a: m.a }; q["fin|" + m.t] = { v: lock, at }; SCORES.fin[m.t] = Object.assign({}, SCORES.fin[m.t] || {}, lock); }
  lsSet(LS.queue, q);
  if (v) SCORES.s[id] = v; else delete SCORES.s[id]; SCORES.at[id] = at;
  saveCache(); render(); flush().then(renderIfChanged);
}
/* Final-level flags (decider winner, skip) go up as "fin|t"; the server merges them into fin[t]. */
function setFin(t, v){
  const q = lsGet(LS.queue, {}), k = "fin|" + t; q[k] = { v: Object.assign({}, q[k] && q[k].v, v), at: Date.now() }; lsSet(LS.queue, q);
  SCORES.fin[t] = Object.assign({}, SCORES.fin[t] || {}, v); saveCache(); render(); flush().then(renderIfChanged);
}

function sig(){ return JSON.stringify([SETUP && SETUP.event, SETUP && JSON.stringify(SETUP).length, SCORES, CHECKINS, RESERVES, REPORTS, online, pulled, Object.keys(lsGet(LS.queue, {})).length, eventDay()]); }
function typing(){ const a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"); }
/* Hold background refreshes while someone is mid-action: typing, a two-tap button armed, or a half-picked score
   (a pick goes stale after 30 s so an abandoned pad can't freeze the screen). The next 5-second pull renders. */
function holdRender(){
  if (typing() || document.querySelector("[data-armed]") || ($("#clearTxt") && $("#clearTxt").value)) return true;
  return Object.keys(pickState).some((id) => Date.now() - (pickAt[id] || 0) < 30000 && document.querySelector(`[data-m="${CSS.escape(id)}"]`));
}
function renderIfChanged(){ const g = sig(); if (g === lastSig) return; if (holdRender()) { deferred = true; return; } deferred = false; render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (deferred) renderIfChanged(); }, 50));
/* Two-tap buttons: the first tap arms and relabels; returns true on the second tap. Disarms itself after 5 s. */
function arm(b, label){
  if (b.dataset.armed) return true;
  b.dataset.armed = "1"; const was = b.innerHTML; b.textContent = label;
  setTimeout(() => { if (b.isConnected && b.dataset.armed) { delete b.dataset.armed; b.innerHTML = was; } if (deferred) renderIfChanged(); }, 5000);
  return false;
}
function render(){
  lastSig = sig(); deferred = false;
  const app = $("#app");
  document.body.classList.toggle("is-test", TEST);
  if (view === "tv") return app.innerHTML = tvView();
  if (view === "you") return app.innerHTML = youView(), bindYou();
  if (view === "control") return app.innerHTML = controlView(), bindControl();
  if (view === "posters") return app.innerHTML = postersView(), bindPosters();
  app.innerHTML = homeView();
}

/* ---------- player score reports ----------
   A player reports their own match from their phone. It shows as pending at the score table and only goes
   on the board when the scorekeeper confirms it. Scores are sent home–away; the player picks from their side. */
const REP_ERR = { already_scored: "The score table already has this score.", not_in_match: "That match isn't yours.", bad_score: "One side has to reach 6, and it can't be level.",
  not_today: "Score reporting opens on the day of the Cup.", slow_down: "Too many reports from this name. Give the score to the score table.", not_loaded: "Squads aren't loaded yet." };
function reportHTML(m){

  const max = (SETUP.format && SETUP.format.gamesTo) || 6, p = repPick[m.id] || [null, null], msg = repMsg[m.id];
  const opp = h ? m.ap : m.hp, partner = (h ? m.hp : m.ap).find((n) => n !== meName), other = REPORTS[m.id] && REPORTS[m.id][h ? "a" : "h"];

  if (mine && !p.edit) { const v = h ? mine.v : [mine.v[1], mine.v[0]];
    return `<div class="card rep" style="margin-top:12px"><h3>Score sent: ${v[0]}–${v[1]} ${v[0] > v[1] ? "win" : "loss"}</h3><p class="muted" style="margin:0 0 8px">${m.final ? "Final" : "Round " + (m.r + 1)} on court ${m.court}. The score table confirms it, then it goes on the board.</p><button class="btn alt" type="button" data-repedit="${m.id}" style="min-height:38px">Change it</button></div>`; }
  const btns = (k, label) => `<div class="muted" style="font-size:14px;margin-top:8px">${label}</div><div class="pick" role="group" aria-label="${esc(label)}">${Array.from({ length: max + 1 }, (_, v) => `<button type="button" data-rp="${m.id}" data-k="${k}" data-v="${v}" aria-pressed="${p[k] === v}">${v}</button>`).join("")}</div>`;
  return `<div class="card rep" style="margin-top:12px"><h3>${p.edit ? `Change your ${m.final ? "final" : "round " + (m.r + 1)} score` : "Finished? Report the score"}</h3>${btns(0, "Games for you & " + partner)}${btns(1, "Games for " + opp.join(" & "))}
    <div style="margin-top:10px"><button class="btn" type="button" data-repgo="${m.id}">Send ${p[0] != null && p[1] != null ? p[0] + "–" + p[1] : "score"}</button></div>
    <div class="msg ${msg && msg.err ? "err" : ""}" role="alert">${msg ? esc(msg.t) : "The score table confirms it before it goes on the board. A 5–5 tiebreak counts as 6–5."}</div></div>`;
}
async function sendReport(id){
  const M = buildMatches(), m = M.find((x) => x.id === id); if (!m) return;
  const h = m.hp.includes(meName), p = repPick[id] || [null, null];
  const err = validScore(p); if (err) { repMsg[id] = { t: err, err: true }; render(); return; }
  const v = h ? [p[0], p[1]] : [p[1], p[0]];
  repMsg[id] = { t: "Sending…" }; render();
  try {
    const r = await rpc(P + "_report", { p_id: id, p_name: meName, p_v: v, p_side: h ? "h" : "a" });
    REPORTS[id] = Object.assign({}, REPORTS[id] || {}, { [r.side]: { v: r.v, by: meName, at: r.at } });
    delete repPick[id]; delete repMsg[id]; online = true; saveCache();
  } catch(e){
    const k = Object.keys(REP_ERR).find((x) => e.message.includes(x));
    repMsg[id] = { t: k ? REP_ERR[k] : "Couldn't send: no signal. Tell the score table the score instead.", err: true };
  }
  render();
}
/* Name search: case- and accent-insensitive, from the start of any word, ignoring the "…" on shortened names. */
const fold = (x) => String(x).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const nameMatch = (n, q) => { q = fold(q); return !q || (" " + fold(n)).includes(" " + q); };

  all("[data-save]", (b) => { const id = b.dataset.save, p = pickState[id] || [null, null], err = validScore(p), el = $("#msg-" + id.replace(/\|/g, "-"));
    if (err) { el.textContent = err; el.className = "msg err"; return; } done(id); setScore(id, p); });
  all("[data-clear]", (b) => { if (arm(b, "Tap again to clear")) setScore(b.dataset.clear, null); });
  all("[data-edit]", (b) => { const id = b.dataset.edit, y = b.getBoundingClientRect().top;
    if (editId && editId !== id) delete pickState[editId];
    editId = id; if (SCORES.s[id]) pickState[id] = SCORES.s[id].slice(); render();
    // Keep the tapped row where it was on screen.
    const nb = document.querySelector(`[data-row="${CSS.escape(id)}"] [data-edit]`); if (nb) scrollBy(0, nb.getBoundingClientRect().top - y); });
  all("#edClose", () => { delete pickState[editId]; editId = null; render(); });
  all("[data-confirm]", (b) => { const id = b.dataset.confirm, v = b.dataset.v.split("–").map(Number); done(id); setScore(id, v); clearReport(id); });
  all("[data-dismiss]", (b) => { if (arm(b, "Tap again to dismiss")) clearReport(b.dataset.dismiss); });
  all("[data-hand]", (b) => { handOpen[b.dataset.hand] = true; render(); });
  all("[data-ffo]", (b) => { ffOpen = b.dataset.ffo; render(); });
  all("[data-ffx]", () => { ffOpen = null; render(); });
  all("[data-ff]", (b) => { if (!arm(b, `Tap again: 6–0 to ${b.dataset.who}`)) return; const id = b.dataset.ff; ffOpen = null; done(id); setScore(id, b.dataset.win === "h" ? [6, 0] : [0, 6]); });
  all("[data-dec]", (b) => { const [t, w] = b.dataset.dec.split("|").map(Number); if (arm(b, `Tap again: ${T(w).name} won the decider`)) setFin(t, { w }); });
  all("#skipFin", (b) => { if (arm(b, "Tap again to end without finals")) setFin(0, { skip: true }); });
  all("#unskip", () => setFin(0, { skip: false }));
  all("#ciMiss", () => { ciMissing = !(ciMissing == null ? eventDay() : ciMissing); render(); });
  all("[data-ci]", async (b) => { const n = b.dataset.ci; if (CHECKINS[n] && !arm(b, `Tap again to mark ${n} out`)) return; b.disabled = true; const ok = await checkIn(n, !CHECKINS[n]); render(); if (!ok) { $("#ciMsg").textContent = "Couldn't change that check-in."; $("#ciMsg").className = "msg err"; } });
  all("[data-res]", async (b) => { const n = b.dataset.res; b.disabled = true;
    try { const r = await rpc(P + "_reserve", { p_name: n, p_on: !RESERVES[n], p_pin: lsGet(LS.pin, "") }); if (r && r.reserve) RESERVES[(r && r.name) || n] = true; else delete RESERVES[(r && r.name) || n]; online = true; saveCache(); render(); }
    catch(e){ render(); $("#ciMsg").textContent = /pin/i.test(e.message) ? "The PIN on this laptop isn't right. Lock and unlock with the correct PIN." : "Couldn't change that: this laptop is offline. Try again on wifi."; $("#ciMsg").className = "msg err"; } });
  const ca = $("#clearAll"), ct = $("#clearTxt");
  if (ct) ct.oninput = () => { ca.disabled = ct.value.trim() !== "CLEAR"; };
  if (ca) ca.onclick = async () => { if (TEST ? !arm(ca, "Tap again to clear all " + Object.keys(SCORES.s).length + " scores") : (!ct || ct.value.trim() !== "CLEAR")) return;
    try { await rpc("cup_write", { p_key: P + "_scores", p_doc:{ s:{}, at:{}, fin:{}, v:3, clearedAt: Date.now() }, p_pin: lsGet(LS.pin, "") }); lsSet(LS.queue, {}); SCORES = { s:{}, at:{}, fin:{} }; REPORTS = {}; saveCache(); rpc(P + "_report_clear", { p_id:"all", p_pin: lsGet(LS.pin, "") }).catch(() => {}); $("#clearMsg").textContent = "All scores cleared."; $("#clearMsg").className = "msg ok"; }
    catch(e){ $("#clearMsg").textContent = "Couldn't clear: check the PIN and the connection."; $("#clearMsg").className = "msg err"; } };
  const rt = $("#resetTest");
  if (rt) rt.onclick = async () => { if (!rt.dataset.armed) { rt.dataset.armed = "1"; rt.textContent = "Tap again to reset"; return; }
    try { await rpc("dwt_reset", { p_pin: lsGet(LS.pin, "") }); lsSet(LS.queue, {}); lsSet(LS.ci, null); SCORES = { s:{}, at:{}, fin:{} }; CHECKINS = {}; REPORTS = {}; saveCache(); $("#resetMsg").textContent = "Reset. Ready for a new rehearsal."; $("#resetMsg").className = "msg ok"; rt.textContent = "Reset test data"; delete rt.dataset.armed; }
    catch(e){ $("#resetMsg").textContent = "Couldn't reset: check the PIN and the connection."; $("#resetMsg").className = "msg err"; } };
  const sg = $("#setupGo");
  if (sg) sg.onclick = async () => { const msg = $("#setupMsg"); let x;
    try { x = JSON.parse($("#setupIn").value); } catch(e){ msg.textContent = "That isn't a setup code. Copy it again from the kit."; msg.className = "msg err"; return; }
    const errs = checkSetup(x); if (errs.length) { msg.innerHTML = errs.slice(0, 8).map(esc).join("<br>"); msg.className = "msg err"; return; }
    msg.textContent = "Loading…"; msg.className = "msg";
    try { await rpc("cup_write", { p_key: P + "_setup", p_doc:x, p_pin: lsGet(LS.pin, "") }); SETUP = x; msg.textContent = "Loaded. Courts, phones and the TV now show these squads."; msg.className = "msg ok"; setTimeout(() => { ctlTab = "courts"; render(); }, 1200); }
    catch(e){ msg.textContent = /pin/i.test(e.message) ? "The PIN on this laptop isn't right. Lock and unlock with the correct PIN." : "Couldn't load: this laptop is offline. Try again on wifi."; msg.className = "msg err"; } };
}

function postersView(){
  if (!SETUP) return `<div class="wrap">${noSetup()}</div>`;
  const M = buildMatches(), byCourt = {}; M.forEach((m) => (byCourt[m.court] = byCourt[m.court] || []).push(m));
  const tools = `<div class="noprint" style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap"><a class="brand" href="#" style="color:inherit;text-decoration:none">${title()}</a><button class="btn" type="button" id="print">Print court sheets</button><span class="muted">One sheet per court, the door QR poster, then one sheet per squad.</span></div>`;
  const pair = (s, p) => s == null ? "" : `<b>${esc(T(s).name)}</b><br>${esc(p.join(" & "))}`;
  const courts = [6,4,2,5,3,1].filter((c) => byCourt[c]).map((c) => { const q = byCourt[c].sort((a, b) => a.r - b.r);
    return `<section class="poster"><div class="sheetqr">${QR_SVG}<span>Scan for your next match / send your score</span></div><h1>Court ${c}</h1><div class="sub">${esc(SETUP.title || "The Diwali Cup")} · Line ${q[0].l + 1} · play these in order</div>
      <table><thead><tr><th>#</th><th>Round</th><th>Home</th><th>Away</th><th class="score">Score</th></tr></thead><tbody>${q.map((m, i) => `<tr><td class="o">${i + 1}</td><td>${m.final ? "Final<br>" + m.label : "Round " + (m.r + 1)}</td><td>${m.final ? `${m.label.split(" v ")[0]} place squad` : pair(m.h, m.hp)}</td><td>${m.final ? `${m.label.split(" v ")[1]} place squad` : pair(m.a, m.ap)}</td><td class="score"></td></tr>`).join("")}</tbody></table>
      <p class="rule">Start your next match as soon as this court is free and all four players are here. If a player is still on another court, wait for them. One set to 6, golden point at deuce, tiebreak at 5–5. Send your score from your phone (scan the QR, tap your name), or give it to the score table.</p></section>`; }).join("");
  const door = `<section class="poster doorqr"><h1>Check in here</h1><div class="sub">Scan, then tap your name. That checks you in and opens your matches: court, partner, opponents and results, live all day.</div>${QR_SVG}<p style="font:700 18px var(--text);margin-top:12px">${esc(BASE.replace(/^https?:\/\//, ""))}#you</p></section>`;
  const squads = SETUP.teams.map((t, s) => `<section class="poster squad"><h1>${esc(t.name)}</h1><div class="sub">Captain ${esc(t.captain || "")} · who plays when</div>${[0,1,2].map((l) => `<h3 style="margin-top:14px;color:#111">Line ${l + 1}</h3><table><thead><tr><th>Round</th><th>Pair</th><th>Court</th></tr></thead><tbody>${M.filter((m) => m.l === l && (m.final ? true : (m.h === s || m.a === s))).map((m) => { const p = m.final ? SETUP.pairs[FINAL][s][l] : (m.h === s ? m.hp : m.ap); const tie = m.final ? null : m; if (m.final && m.t === 1) return ""; return `<tr><td>${m.final ? "Final" : "Round " + (m.r + 1)}</td><td>${esc(p.join(" & "))}</td><td>${m.final ? "Set by standings" : m.court}</td></tr>`; }).join("")}</tbody></table>`).join("")}</section>`).join("");
  return `<div class="wrap">${tools}${courts}${door}${squads}</div>`;
}
function bindPosters(){ const p = $("#print"); if (p) p.onclick = () => window.print(); }

const QR_SVG = (window.QR_SVG || "");
window.__dw = { buildMatches, setScore, finalResult, statusAll, standings, mvp, podium, pull, scores: () => SCORES, reports: () => REPORTS };   // used by the test script only
route(); pull(); setInterval(pull, 5000);
addEventListener("online", pull);
})();
</script>
