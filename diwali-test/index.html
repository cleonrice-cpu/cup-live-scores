:root{
  --bg:#FCFBF7; --surface:#FFFFFF; --sunk:#F6F1E7; --ink:#132051; --muted:#5E6483; --rule:#E8E0D0;
  --mari:#D9166B; --pink:#ED1F74; --blue:#29ACEE; --blue-ink:#0B78B5; --red:#E13025; --yellow:#FCC626; --orange:#FB961D;

  --disp:"Anton","Arial Narrow","Helvetica Neue",Arial,sans-serif;

}

.cun-top{flex:none}
body:not(.tv):not(.pv)::before{content:"";display:block;height:44px;background:var(--bunting) repeat-x left top/auto 100%}
body:not(.tv):not(.pv)::after{content:"";display:block;height:40px;margin-top:24px;background:var(--diya) repeat-x left bottom/auto 100%}
.brand{display:inline-flex;align-items:center;gap:.5em;font:400 22px/1 var(--disp);text-transform:uppercase;letter-spacing:.01em;color:var(--pink)}
.brand .lgo{display:block;height:2.1em;width:auto;flex:none}
.bar .brand{font-size:28px}
.sqn{color:var(--red)}
.brand .ttl{border-left:2px solid var(--red);padding-left:.5em;display:flex;flex-direction:column;gap:.12em}
.brand .ttl span{display:block;line-height:.95}
.brand .ttl i{display:block;height:.14em;border-radius:.1em;background:var(--blue)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mari);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:env(safe-area-inset-top)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.off i{background:var(--bad)} .sync.pending i{background:var(--mari)}
h1{font:400 clamp(34px,6vw,56px)/1 var(--disp);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.01em}
h2{font:400 26px/1.05 var(--disp);margin:0 0 10px;text-transform:uppercase;letter-spacing:.01em}
h3{font:400 19px/1.1 var(--disp);margin:0 0 6px;letter-spacing:.01em}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 1px 0 var(--rule),0 0 0 1px var(--rule) inset}
.btn{border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:700;cursor:pointer;background:var(--pink);color:#fff}
.btn.alt{background:transparent;border:1px solid var(--rule);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.alt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.now{background:var(--ok);color:#fff} .pill.wait{background:var(--sunk);color:var(--mari)} .pill.done{background:var(--sunk);color:var(--muted)} .pill.later{background:var(--sunk);color:var(--muted)} .pill.sent{background:var(--sunk);color:var(--ok)}
.lnk{background:none;border:0;padding:4px 0;min-height:32px;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}
.btn.sm{min-height:34px;padding:4px 12px;font-size:14px}
.champ{border-left:6px solid var(--mari);margin-top:12px;font:800 22px/1.2 var(--disp)}
.champ b{color:var(--mari)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:800 26px/1.1 var(--disp);margin-bottom:8px}

/* ---------- TV (sized on screen height: it must fit a landscape TV with no scrolling) ---------- */
body.tv{overflow:hidden;height:100vh}
.tvw{height:100vh;display:grid;grid-template-rows:3.6vh auto minmax(0,1fr) 2.8vh;gap:1vh;padding:0 1.8vw}
.tvb,.tvd{margin:0 -1.8vw}.tvb{background:var(--bunting) repeat-x left top/auto 100%}.tvd{background:var(--diya) repeat-x left bottom/auto 100%}
.tvhead{display:flex;align-items:center;justify-content:space-between;gap:2vw;min-width:0;border-bottom:2px solid var(--red);padding-bottom:.6vh}
.tvhead .brand{font-size:clamp(18px,4.2vh,52px);white-space:nowrap}
.tvhead .brand .lgo{height:1.75em}
.tvhead .meta{display:flex;gap:2.4vw;margin-right:auto;margin-left:2vw}.tvhead .meta div{display:flex;flex-direction:column;border-left:1px solid var(--rule);padding-left:1vw}.tvhead .meta small{font:400 clamp(9px,1.6vh,18px) var(--disp);color:var(--red);text-transform:uppercase;letter-spacing:.03em}.tvhead .meta b{font:400 clamp(14px,3.4vh,40px)/1 var(--disp);text-transform:uppercase;color:var(--ink)}
.tvhead .prog{font:400 clamp(14px,3vh,36px) var(--disp);color:var(--muted);white-space:nowrap;text-transform:uppercase}
.tvhead .prog b{color:var(--mari)}
.tvmain{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:1.4vw;min-height:0}
.courts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.4vh 1vw;min-height:0}
.ct{background:var(--surface);box-shadow:0 0 0 1px var(--rule) inset;border-radius:1.4vh;padding:1.2vh 1vw;display:flex;flex-direction:column;gap:.5vh;min-height:0;overflow:hidden;border-top:.6vh solid var(--rule)}
.ct.now{border-top-color:var(--ok)} .ct.wait{border-top-color:var(--mari)}
.ct .ch{display:flex;justify-content:space-between;align-items:baseline;gap:.5vw}
.ct .cn{font:400 clamp(18px,3.8vh,46px)/1 var(--disp);text-transform:uppercase}
.ct .cl{font-size:clamp(10px,1.8vh,20px);color:var(--muted);font-weight:600;white-space:nowrap}
.ct .stg{font-size:clamp(10px,1.8vh,20px);color:var(--mari);font-weight:700}
.side{display:flex;align-items:center;gap:.6vw;min-width:0}
.side .sw{width:1.8vh;height:1.8vh;min-width:9px;min-height:9px}
.side .nm{font-weight:600;font-size:clamp(11px,2.05vh,24px);line-height:1.12;min-width:0;overflow-wrap:anywhere}
.side .sq{font:400 clamp(10px,1.55vh,18px)/1.1 var(--disp);color:var(--red);letter-spacing:.03em;text-transform:uppercase}
.vs{font-size:clamp(9px,1.5vh,17px);color:var(--muted);font-weight:700}
.ct .st{margin-top:auto;font-size:clamp(10px,1.8vh,20px);color:var(--muted)}

function splitOpts(q){ const out = []; [1, 2, 3].forEach((k) => { const a = [q[0], q[k]], b = q.filter((n, i) => i && i !== k); out.push([a, b], [b, a]); }); return out; }
/* Lines of squad s whose Round r lineup differs from the snapshot taken when squads were first loaded. */
function changedLines(r, s){ const L = SETUP.loaded; if (!L) return []; return [0, 1, 2].filter((l) => { try { return !samePair(SETUP.pairs[r][s][l], L[r][s][l]); } catch(e){ return false; } }); }
const T = (s) => SETUP.teams[s];
const nick = (s) => T(s).name.split(" ").pop();   // "Deconstructed Samosas" -> "Samosas", for tight scorer lines
const sideHTML = (s, pair) => s == null ? `<div class="side"><span class="nm muted">To be decided</span></div>` :
  `<div class="side"><span class="sw" style="background:${esc(T(s).color)}"></span><div><div class="sq">${esc(T(s).name)}</div><div class="nm">${esc(pair ? pair.join(" & ") : "")}</div></div></div>`;

/* ---------- data ---------- */
async function pull(){
  try {
    // A venue wifi with no internet can hang a request for minutes; give up after 8 s so the page can say there's no signal.
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 8000);
    const r = await fetch(SB_URL + `/rest/v1/cup_state?select=key,doc,updated_at&key=in.(${P}_setup,${P}_scores,${P}_checkins,${P}_subs)`, { headers: HDR, cache: "no-store", signal: ac.signal }).finally(() => clearTimeout(to));
    if (!r.ok) throw new Error(r.status);
    const rows = await r.json(); online = true; lastSeen = Date.now();
    rows.forEach((row) => { if (row.key === P + "_setup") { oldSetup = !!row.doc && !v2(row.doc); SETUP = v2(row.doc) ? row.doc : null; } if (row.key === P + "_scores") mergeRemote(row.doc); if (row.key === P + "_checkins") { CHECKINS = (row.doc && row.doc.in) || {}; RESERVES = (row.doc && row.doc.res) || {}; PHONES = (row.doc && row.doc.ph) || {}; } if (row.key === P + "_subs") SUBS = (row.doc && row.doc.s) || {}; });
    const sq = lsGet(LS.setupQ, null); if (v2(sq)) SETUP = sq;   // a lineup change not yet sent wins over the copy just read
    saveCache();
  } catch(e){ online = false; }
  pulled = true;
  await flush(); await flushSetup(); await flushCheckin(); renderIfChanged();
}
/* ---------- check-in ---------- */
function todayLA(){ try { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); } catch(e){ return new Date().toISOString().slice(0, 10); } }
const eventDay = () => !!(SETUP && (TEST || (SETUP.date && todayLA() === SETUP.date)));
const clock12 = (iso) => { const m = /T(\d\d):(\d\d)/.exec(iso || ""); if (!m) return ""; let h = +m[1]; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${m[2]} ${ap}`; };
async function checkIn(name, present = true){
  try {
    const r = await rpc(P + "_checkin", { p_name: name, p_present: present });
    if (present) { CHECKINS[name] = (r && r.at) || "yes"; lsSet(LS.ci, { name, date: SETUP.date }); } else { delete CHECKINS[name]; lsSet(LS.ci, null); }
    lsSet(LS.ciPending, null); online = true; return true;
  } catch(e){
    if (/unknown_name|not_today|not_loaded/.test(e.message)) return false;
    lsSet(LS.ciPending, { name, present, date: SETUP.date }); online = false;
    if (present) CHECKINS[name] = CHECKINS[name] || "pending"; return true;
  }
}
async function flushCheckin(){ const p = lsGet(LS.ciPending, null); if (p && SETUP && p.date === SETUP.date) await checkIn(p.name, p.present); }
function checkedInHere(){ const c = lsGet(LS.ci, null); return c && SETUP && c.date === SETUP.date ? c.name : null; }
function mergeRemote(doc){
  SCORES = { s: Object.assign({}, doc.s || {}), at: Object.assign({}, doc.at || {}), fin: JSON.parse(JSON.stringify(doc.fin || {})) };
  mergeQueue();
}
/* Scores entered on this device but not yet confirmed sent always win over the copy just read. */
function mergeQueue(){
  Object.entries(lsGet(LS.queue, {})).forEach(([id, e]) => {
    if (id.startsWith("fin|")) { const t = id.slice(4); SCORES.fin[t] = Object.assign({}, SCORES.fin[t] || {}, e.v); return; }
    if (!SCORES.at[id] || e.at >= SCORES.at[id]) { if (e.v) SCORES.s[id] = e.v; else delete SCORES.s[id]; SCORES.at[id] = e.at; }
  });
}
async function rpc(fn, body){
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, { method:"POST", headers: Object.assign({ "Content-Type":"application/json" }, HDR), body: JSON.stringify(body) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || ("HTTP " + r.status));
  if ((j && j.error) || (typeof j === "string" && j.startsWith("error:"))) throw new Error(j.error || j.slice(7).trim());
  return j;
}
let flushing = false;
async function flush(){
  const q = lsGet(LS.queue, {}), pin = PIN;
  if (flushing || !pin || !Object.keys(q).length) return;
  flushing = true;
  try {
    // Each match goes up on its own and the server applies it atomically, so two scoring devices never overwrite each other.
    // Keep going until the queue is empty, so a score entered while another is sending goes straight up too.
    for (let left = q, guard = 0; Object.keys(left).length && guard < 50; left = lsGet(LS.queue, {}), guard++) {
      for (const [id, e] of Object.entries(left)) {
        await rpc(P + "_score", { p_id: id, p_v: e.v || null, p_at: e.at, p_pin: pin });
        const now = lsGet(LS.queue, {}); if (now[id] && now[id].at === e.at) { delete now[id]; lsSet(LS.queue, now); }
      }
    }
    online = true; saveCache();
  } catch(e){
    // A changed PIN asks for the new one; queued scores stay on this device and send once it's entered.
    if (/bad pin/.test(e.message)) { lsSet(LS.pin, null); online = true; lastSig = ""; } else online = false;
  } finally { flushing = false; }
}
/* Lineup changes, "lineup in" ticks and releases rewrite the whole setup doc (cup_write). The newest copy waits on
   this laptop until it's sent, so a release made with no signal goes out when the wifi is back. */
let flushingSetup = false;
async function flushSetup(){
  const x = lsGet(LS.setupQ, null), pin = PIN;
  if (flushingSetup || !x || !pin) return;
  flushingSetup = true;
  try { await rpc("cup_write", { p_key: P + "_setup", p_doc: x, p_pin: pin }); if (JSON.stringify(lsGet(LS.setupQ, null)) === JSON.stringify(x)) lsSet(LS.setupQ, null); online = true; }
  catch(e){ if (/pin/i.test(e.message)) { lsSet(LS.pin, null); online = true; lastSig = ""; } else online = false; }
  finally { flushingSetup = false; }
}
function editSetup(fn, msg){
  const x = JSON.parse(JSON.stringify(SETUP)); fn(x); SETUP = x; lsSet(LS.setupQ, x); luMsg = msg || null;
  saveCache(); render(); flushSetup().then(renderIfChanged);
}
function setScore(id, v){
  const q = lsGet(LS.queue, {}); const at = Date.now();
  q[id] = { v, at };
  // The first saved score of a Round 4 or Round 5 tie locks which squads are in it, so later corrections elsewhere can't move it.
  const m = buildMatches().find((x) => x.id === id);
  if (m && m.r >= R4 && v && m.h != null && !lockOf(m.r, m.t)) { const lock = { [m.r === R4 ? "r4" : "r5"]: { h: m.h, a: m.a } }, k = "fin|" + m.t;
    q[k] = { v: Object.assign({}, q[k] && q[k].v, lock), at }; SCORES.fin[m.t] = Object.assign({}, SCORES.fin[m.t] || {}, lock); }
  lsSet(LS.queue, q);
  if (v) SCORES.s[id] = v; else delete SCORES.s[id]; SCORES.at[id] = at;
  saveCache(); render(); flush().then(renderIfChanged);
}
/* Tie-level flags (decider winner, skip) go up as "fin|t"; the server merges them into fin[t]. */
function setFin(t, v){
  const q = lsGet(LS.queue, {}), k = "fin|" + t; q[k] = { v: Object.assign({}, q[k] && q[k].v, v), at: Date.now() }; lsSet(LS.queue, q);
  SCORES.fin[t] = Object.assign({}, SCORES.fin[t] || {}, v); saveCache(); render(); flush().then(renderIfChanged);
}

/* ---------- router ---------- */
function route(){
  const h = location.hash.replace("#", "").split(",");
  // #you=Full%20Name opens that player's page (the captains' links); the phone step still applies.
  const mm = /^you=(.+)$/.exec(h[0]); if (mm) { let n = mm[1]; try { n = decodeURIComponent(n); } catch(e){} if (n !== meName) { meName = n; lsSet(LS.me, n); capDraft = null; } h[0] = "you"; }
  const pm = /^p=(.+)$/.exec(h[0]); if (pm) { try { pName = decodeURIComponent(pm[1]); } catch(e){ pName = pm[1]; } h[0] = "player"; }
  view = ["tv","you","control","posters","squads","player"].includes(h[0]) ? h[0] : "home";
  document.documentElement.classList.toggle("dark", h.includes("dark") && view !== "posters");
  document.body.className = view === "tv" ? "tv" : view === "posters" ? "pv" : "";
  render();
}
addEventListener("hashchange", route);

function syncHTML(){
  const pending = Object.keys(lsGet(LS.queue, {})).length + (lsGet(LS.setupQ, null) ? 1 : 0);
  const cls = !online ? "off" : pending ? "pending" : "";
  const t = !online ? "Offline, scores are kept on this device and send when the signal is back" : pending ? `Sending ${pending} change${pending > 1 ? "s" : ""}…` : "Live";
  return `<span class="sync ${cls}"><i></i>${t}</span>`;
}
function noSetup(){
  if (!pulled) return `<div class="empty"><b>Loading…</b></div>`;
  if (!online) return `<div class="empty"><b>No signal yet</b>Move closer to the door or join the club wifi, then this page loads by itself.${view === "you" ? " Or check in at the score desk." : ""}</div>`;
  return `<div class="empty"><b>Squads aren't loaded yet</b>The scoring laptop loads them from the Diwali Cup Kit before the day.</div>`; }

/* ---------- views ---------- */
function sig(){ return JSON.stringify([SETUP, SCORES, CHECKINS, RESERVES, PHONES, SUBS, online, pulled, Object.keys(lsGet(LS.queue, {})).length, !!lsGet(LS.setupQ, null), eventDay()]); }
function typing(){ const a = document.activeElement; return a && ((a.tagName === "INPUT" && !/checkbox|radio/.test(a.type)) || a.tagName === "TEXTAREA" || a.tagName === "SELECT"); }
/* Hold background refreshes while someone is mid-action: typing, a two-tap button armed, or a half-picked score
   (a pick goes stale after 30 s so an abandoned pad can't freeze the screen). The next 5-second pull renders. */
function holdRender(){
  if (typing() || document.querySelector("[data-armed]") || ($("#clearTxt") && $("#clearTxt").value)) return true;
  return Object.keys(pickState).some((id) => Date.now() - (pickAt[id] || 0) < 30000 && document.querySelector(`[data-win="${CSS.escape(id)}"]`));
}
function renderIfChanged(){ const g = sig(); if (g === lastSig) return; if (holdRender()) { deferred = true; return; } deferred = false; render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (deferred) renderIfChanged(); }, 50));
/* Two-tap buttons: the first tap arms and relabels; returns true on the second tap. Disarms itself after 5 s. */
function arm(b, label){
  if (b.dataset.armed) return true;
  b.dataset.armed = "1"; const was = b.innerHTML; b.textContent = label;
  setTimeout(() => { if (b.isConnected && b.dataset.armed) { delete b.dataset.armed; b.innerHTML = was; } if (deferred) renderIfChanged(); }, 5000);
  return false;
}
function render(){
  lastSig = sig(); deferred = false;
  const app = $("#app");
  document.body.classList.toggle("is-test", TEST);
  if (view === "tv") { app.innerHTML = tvView(); fitResults(); return; }
  if (view === "you") return app.innerHTML = youView(), bindYou();
  if (view === "control") return app.innerHTML = controlView(), bindControl();
  if (view === "posters") return app.innerHTML = postersView(), bindPosters();
  if (view === "squads") return app.innerHTML = squadsView();
  if (view === "player") return app.innerHTML = playerView(pName);
  app.innerHTML = homeView();
}
/* The TV's results list is newest first; drop the oldest rows that don't fit and say how many. */
function fitResults(){
  const box = $(".res"); if (!box) return; const card = box.closest(".card"); let hid = 0;
  const rows = [...box.querySelectorAll(".rr")];
  while (rows.length && card.scrollHeight > card.clientHeight + 1) { rows.pop().remove(); hid++; if (hid === 1) box.insertAdjacentHTML("beforeend", `<div class="rmore"></div>`); box.querySelector(".rmore").textContent = `+ ${hid} earlier tie${hid > 1 ? "s" : ""}`; }
}

const sealedText = (r) => `Round ${r + 1} · ${STAGE[r]}: lineups at the score desk`;

function tvView(){
  if (!SETUP) return `<div class="tvw"><div class="tvb"></div><div class="tvhead"><div class="brand">${title()}</div>${syncHTML()}</div>${noSetup()}<div class="tvd"></div></div>`;
  const M = buildMatches(), { st, byCourt } = statusAll(M), V = mvp(M), pd = podium(M), sg = stageOf(M);
  const done = M.filter((m) => SCORES.s[m.id]).length;
  const roster = SETUP.lines.flat(2), here = roster.filter(present).length;
  // Until all four captains submit, Rounds 1-3 show squads only: the pairs on file are just defaults.
  const shown = (m) => m.r >= R4 || pairsFinal(), sideTV = (m, s2, pair) => shown(m) ? sideHTML(s2, pair) : sideHTML(s2, ["Pairs to come"]);
  const pairs = (m) => shown(m) ? `${esc(m.hp.join(" & "))} <span class="muted">(${esc(nick(m.h))})</span> v ${esc(m.ap.join(" & "))} <span class="muted">(${esc(nick(m.a))})</span>` : `${esc(T(m.h).name)} v ${esc(T(m.a).name)}`;
  const courts = CO.filter((c) => byCourt[c]).map((c) => {
    const q = byCourt[c], cur = q.find((m) => !played(m.id)), last = q.slice().reverse().find((m) => SCORES.s[m.id]);
    const nxt = cur ? q[q.indexOf(cur) + 1] : null;
    const lastHTML = last ? `<div class="nx">Last: ${esc(nick(last.h))} <b class="num" style="color:var(--ink)">${SCORES.s[last.id][0]}–${SCORES.s[last.id][1]}</b> ${esc(nick(last.a))} · R${last.r + 1} W${last.w + 1}</div>` : "";
    const head = (m) => `<div class="ch"><span class="cn">Court ${c}</span><span class="cl">${m ? `R${m.r + 1} · Wave ${m.w + 1} · ` : ""}Line ${q[0].l + 1}</span></div>`;
    if (!cur) return `<div class="ct">${head(null)}<div class="st"><b>All sets played</b></div>${lastHTML}</div>`;
    const s = st[cur.id];
    const nxtHTML = !nxt ? "" : pub(nxt) && nxt.h != null ? `<div class="nx"><b style="color:var(--ink)">Next</b> · R${nxt.r + 1} W${nxt.w + 1}: ${pairs(nxt)}</div>` : `<div class="nx"><b style="color:var(--ink)">Next</b> · ${esc(sealedText(nxt.r))}</div>`;
    if (!pub(cur) || cur.h == null) return `<div class="ct wait">${head(null)}<div class="seal">${esc(sealedText(cur.r))}</div><div class="st">${s.sealed ? "Starts when the desk releases the round" : esc(s.why)}</div>${lastHTML}</div>`;
    return `<div class="ct ${s.k}">${head(cur)}<div class="stg">${esc(tieName(cur) || STAGE[cur.r])}</div>
      ${sideTV(cur, cur.h, cur.hp)}<div class="vs">v</div>${sideTV(cur, cur.a, cur.ap)}
      <div class="st">${s.k === "now" ? (eventDay() ? "<b>Up now</b>" : "<b>First up</b>") : esc(s.why)}</div>${nxtHTML}${lastHTML}</div>`;
  }).join("");
  // Standings: totals over every round played. Rounds 1-3 seed Round 4; Round 4 and the finals decide the Cup.
  const gd = (x) => x.gw - x.gl >= 0 ? `+${x.gw - x.gl}` : `−${x.gl - x.gw}`;
  const sets = [0, 0, 0, 0]; M.forEach((m) => { const sc = SCORES.s[m.id]; if (sc && m.h != null) sets[sc[0] > sc[1] ? m.h : m.a]++; });
  const SA = standings(M, NR), byS = {}; SA.forEach((x) => { byS[x.s] = x; });
  const PL = placings(M), full = PL.every((x) => x != null), r4set = M.some((m) => m.r === R4 && m.h != null);
  const row = (lab, s2, cls) => { const x = byS[s2]; return `<tr><td class="${cls || ""}">${lab}</td><td class="sq"><span class="sw" style="background:${esc(T(s2).color)}"></span>${esc(T(s2).name)}</td><td class="r">${x.gw}</td><td class="r muted">${gd(x)}</td><td class="r muted">${sets[s2]}</td></tr>`; };
  const thead = `<thead><tr><td></td><td>Squad</td><td class="r">Games</td><td class="r">+/–</td><td class="r">Sets</td></tr></thead>`;
  const stand = full ? `<h2>Final placings</h2><table class="stand">${thead}<tbody>${PL.map((s2, i) => row(["Cup", "2nd", "3rd", "4th"][i], s2, "pl")).join("")}</tbody></table><div class="cap1">Placings come from the finals; games are the day's totals.</div>`
    : `<h2>Standings</h2><table class="stand">${thead}<tbody>${SA.map((x, i) => row(i + 1, x.s)).join("")}</tbody></table><div class="cap1">${r4set ? "Totals so far. Round 4 and the finals decide the Cup: see results." : "Total games, then game difference, then head-to-head. After Round 3: 1st v 4th, 2nd v 3rd."}</div>`;
  // Results: one line per tie (three courts, two waves), newest first.
  const lab = (r, t) => r < R4 ? `R${r + 1}` : r === R4 ? (t ? "R4 2v3" : "R4 1v4") : (t ? "3rd place" : "Cup final");
  const res = [];
  for (let r = NR - 1; r >= 0; r--) for (let t = 0; t < 2; t++) { const x = tieTotals(M, r, t); if (!x || !x.n) continue;
    const F = r >= R4 ? tieResult(M, r, t) : null, fin = x.n === x.of, wS = F ? F.w : fin && x.gh !== x.ga ? (x.gh > x.ga ? x.h : x.a) : null;
    const sh = M.filter((m) => m.r === r && m.t === t && SCORES.s[m.id] && SCORES.s[m.id][0] > SCORES.s[m.id][1]).length, sa = x.n - sh;
    res.push(`<div class="rr"><span class="rl">${lab(r, t)}</span><span class="h ${wS === x.h ? "w" : ""}"><span class="sw" style="background:${esc(T(x.h).color)}"></span>${esc(nick(x.h))}</span><span class="g">${x.gh}–${x.ga}</span><span class="a ${wS === x.a ? "w" : ""}"><span class="sw" style="background:${esc(T(x.a).color)}"></span>${esc(nick(x.a))}</span><span class="n ${fin ? "" : "live"}">${!fin ? `${x.n}/${x.of} sets` : F && F.level ? "golden point" : `sets ${sh}–${sa}`}</span></div>`); }

    ed = Object.assign(keepEd(), w && (w[0] !== s || w[1] !== l) ? { row: { n, kind: "move", sq: s, ln: l } } : {}); render(); };
  document.querySelectorAll("[data-edsqsel]").forEach((el) => el.onchange = () => mv(el.dataset.edsqsel));
  document.querySelectorAll("[data-edlnsel]").forEach((el) => el.onchange = () => mv(el.dataset.edlnsel));
  document.querySelectorAll("[data-edwith]").forEach((el) => el.onchange = () => { if (ed.row) ed.row.with = el.value; });
  all("[data-edmove]", (b) => { const n = b.dataset.edmove, w = ed.row && ed.row.with;
    if (!w) return say(`Pick who ${n} swaps with.`, true);
    if (!arm(b, "Tap again to move")) return; run("roster", { p_op: "swap", p_a: n, p_b: w, p_keep_phone: true }, `Moved: ${n} and ${w} traded places.`); });
  all("[data-eddropb]", (b) => { const n = b.dataset.eddropb; ed = Object.assign(keepEd(), { row: { n, kind: "drop", newName: "" } }); render();
    const i = document.querySelector(`[data-ednew="${CSS.escape(n)}"]`); if (i) i.focus(); });
  document.querySelectorAll("[data-ednew]").forEach((el) => { el.oninput = () => { if (ed.row) ed.row.newName = el.value; };
    el.onkeydown = (e) => { if (e.key === "Enter") { const b = document.querySelector(`[data-eddrop="${CSS.escape(el.dataset.ednew)}"]`); if (b) b.click(); } }; });
  all("[data-eddrop]", (b) => { const n = b.dataset.eddrop, nb = ((ed.row && ed.row.newName) || "").trim();
    if (!nb) return say("Type the new player's full name.", true);
    if (nb === n) return say("That's the same name. To fix a spelling, type over the name instead.", true);
    if (!arm(b, `Tap again: drop ${n}, add ${nb}`)) return; run("roster", { p_op: "rename", p_a: n, p_b: nb, p_keep_phone: false }, `Done: ${nb} replaces ${n} everywhere.`); });
  all("[data-edcap]", (b) => { const n = b.dataset.edcap, w = where(n); if (!w) return; if (SETUP.teams[w[0]].captain === n) return say(`${n} is already captain.`);
    if (!arm(b, "OK?")) return; run("captain", { p_squad: w[0], p_name: n }, `${n} is now captain of ${SETUP.teams[w[0]].name}.`); });
  document.querySelectorAll("[data-ct]").forEach((el) => el.oninput = () => { ed["c" + el.dataset.ct[0] + el.dataset.ct[1]] = el.value; });
  all("#ctGo", (b) => { const C = SETUP.courts || { A: [1, 3, 5], B: [2, 4, 6] }, v = (k, i) => Number(ed["c" + k + i] != null ? ed["c" + k + i] : C[k][i]);
    const A = [0, 1, 2].map((i) => v("A", i)), B = [0, 1, 2].map((i) => v("B", i));
    if (new Set(A.concat(B)).size !== 6 || A.concat(B).some((x) => !Number.isInteger(x) || x < 1 || x > 99)) return say(EDERR.bad_courts, true);
    if (!arm(b, "Tap again to save courts")) return; run("courts", { p_a: A, p_b: B }, `Courts saved: Tie A ${A.join(", ")} · Tie B ${B.join(", ")}.`); });
  const ca = $("#clearAll"), ct = $("#clearTxt");
  if (ct) ct.oninput = () => { ca.disabled = ct.value.trim() !== "CLEAR"; };
  if (ca) ca.onclick = async () => { if (TEST ? !arm(ca, "Tap again to clear all " + Object.keys(SCORES.s).length + " scores") : (!ct || ct.value.trim() !== "CLEAR")) return;
    try { await rpc("cup_write", { p_key: P + "_scores", p_doc:{ s:{}, at:{}, fin:{}, v:3, clearedAt: Date.now() }, p_pin: PIN }); lsSet(LS.queue, {}); SCORES = { s:{}, at:{}, fin:{} }; saveCache(); panelMsg = { id: "clearMsg", t: "All scores cleared." }; reseal(); $("#clearMsg").textContent = "All scores cleared."; $("#clearMsg").className = "msg ok"; }
    catch(e){ $("#clearMsg").textContent = "Couldn't clear: check the connection."; $("#clearMsg").className = "msg err"; } };
  const rt = $("#resetTest");
  if (rt) rt.onclick = async () => { if (!rt.dataset.armed) { rt.dataset.armed = "1"; rt.textContent = "Tap again to reset"; return; }
    try { await rpc("dwt_reset", { p_pin: PIN }); lsSet(LS.queue, {}); lsSet(LS.ci, null); SCORES = { s:{}, at:{}, fin:{} }; CHECKINS = {}; PHONES = {}; SUBS = {}; lsSet(LS.mev, null); saveCache(); panelMsg = { id: "resetMsg", t: "Reset. Ready for a new rehearsal." }; reseal(); if (SETUP && SETUP.pairsFinal) editSetup((x) => { delete x.pairsFinal; delete x.pairsAt; }); $("#resetMsg").textContent = "Reset. Ready for a new rehearsal."; $("#resetMsg").className = "msg ok"; rt.textContent = "Reset test data"; delete rt.dataset.armed; }
    catch(e){ $("#resetMsg").textContent = "Couldn't reset: check the connection."; $("#resetMsg").className = "msg err"; } };
  const sg = $("#setupGo");
  if (sg) sg.onclick = async () => { const msg = $("#setupMsg"); let x;
    try { x = JSON.parse($("#setupIn").value); } catch(e){ msg.textContent = "That isn't a setup code. Copy it again from the kit."; msg.className = "msg err"; return; }
    const errs = checkSetup(x); if (errs.length) { msg.innerHTML = errs.slice(0, 8).map(esc).join("<br>"); msg.className = "msg err"; return; }
    // On the day, reloading the same event keeps the first snapshot ("loaded"), the releases and the lineup ticks.
    // Before the day, a fresh load takes a new snapshot, so changes in the kit don't count against the two-line rule.
    const prev = SETUP, keep = prev && prev.event === x.event && (TEST || todayLA() === x.date);
    if (keep) { if (!x.loaded && prev.loaded) x.loaded = prev.loaded; if (!x.released && prev.released) x.released = prev.released; if (!x.lineupIn && prev.lineupIn) x.lineupIn = prev.lineupIn; }
    if (!x.loaded) x.loaded = JSON.parse(JSON.stringify(x.pairs));
    msg.textContent = "Loading…"; msg.className = "msg";
    try { await rpc("cup_write", { p_key: P + "_setup", p_doc:x, p_pin: PIN }); SETUP = x; oldSetup = false; lsSet(LS.setupQ, null); saveCache(); msg.textContent = "Loaded. Courts, phones and the TV now show these squads."; msg.className = "msg ok"; setTimeout(() => { ctlTab = "courts"; render(); }, 1200); }
    catch(e){ msg.textContent = /pin/i.test(e.message) ? "The scoreboard refused the change. Reload the page and try again." : "Couldn't load: this laptop is offline. Try again on wifi."; msg.className = "msg err"; } };
}

function postersView(){
  if (!SETUP) return `<div class="wrap">${noSetup()}</div>`;
  const all = buildMatches(), M = all.filter((m) => m.r < R4), byCourt = {}; M.forEach((m) => (byCourt[m.court] = byCourt[m.court] || []).push(m));
  const n = [0, 1, 2, 3].filter((k) => SUBS[k]).length;
  const tools = `<div class="noprint cstools"><a class="brand" href="#" style="color:inherit;text-decoration:none">${title()}</a><button class="btn" type="button" id="print">Print court sheets</button><span class="muted">Six pages, one per court. Letter, portrait.</span></div>
    ${pairsFinal() ? "" : `<div class="noprint cc wait" style="margin-bottom:16px"><b>Wait before printing:</b> ${n} of 4 captains have submitted their pairs. These sheets still show default pairs.</div>`}`;
  const side = (s, p) => `<div class="csd"><i style="background:${esc(T(s).color)}"></i><div><b>${esc(T(s).name)}</b><span>${esc(p.join("  &  "))}</span></div></div>`;
  const blank = `<div class="csw"></div>`;
  const courts = [1, 2, 3, 4, 5, 6].filter((c) => byCourt[c]).map((c) => {
    const q = byCourt[c].sort((a, b) => a.r - b.r || a.w - b.w), line = q[0].l + 1, tie = all.find((m) => m.court === c).t;
    const rows = q.map((m, i) => `<div class="csr"><div class="csn">${i + 1}</div><div class="csl"><b>Round ${m.r + 1}</b><span>Wave ${m.w + 1}</span></div>${side(m.h, m.hp)}<div class="csv">v</div>${side(m.a, m.ap)}</div>`).join("");
    const later = [R4, R5].flatMap((r) => [0, 1].map((w) => `<div class="csr desk"><div class="csn">${q.length + (r - R4) * 2 + w + 1}</div><div class="csl"><b>Round ${r + 1}</b><span>Wave ${w + 1}</span></div><div class="csd note"><i style="background:#E8E0D0"></i><div><b>${r === R4 ? (tie ? "2nd v 3rd" : "1st v 4th") : (tie ? "Third place" : "Cup final")}</b><span>Matchup from the score desk</span></div></div><div class="csv">v</div>${blank}</div>`)).join("");
    return `<section class="cs" style="--lc:var(--l${line - 1})"><div class="csbun"></div><header class="csh"><div class="csc"><small>Court</small><b>${c}</b></div><div class="csm"><div class="csline">Line ${line}</div><div class="cstt">Diwali Cup</div><div class="muted2">Saturday, November 7 · Park Padel South San Francisco · play in order, wave 1 then wave 2</div></div><img class="cslogo" src="${LOGO}" alt="Curry Up Now"></header>
      <div class="cst"><div class="csr hd"><div>#</div><div>Round</div><div>Home</div><div></div><div>Away</div></div>${rows}${later}</div></section>`; }).join("");
  return `<div class="wrap">${tools}${courts}</div>`;
}
function bindPosters(){ const p = $("#print"); if (p) p.onclick = () => window.print(); }

const QR_SVG = (window.QR_SVG || "");
window.__dw = { buildMatches, setScore, setFin, finalResult, statusAll, standings, mvp, podium, placings, pull, checkSetup, validScore, changedLines, scores: () => SCORES, setup: () => SETUP };   // used by the test script only
route(); pull(); setInterval(pull, 5000);
addEventListener("online", pull);
})();
</script>
